services:
  uav-db:
    container_name: uav-db
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: uav
      POSTGRES_PASSWORD: uav
      POSTGRES_DB: uav
    ports:
      # host port 由根目錄 .env 的 DB_PORT 決定（見 scripts/setup.sh；一律 30000 以上）
      - "${DB_PORT:-35432}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uav"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # PX4 SITL (headless Gazebo)。host network 讓 MAVLink UDP 直接打到本機 14540/14550
  uav-sitl:
    container_name: uav-sitl
    image: jonasvautherin/px4-gazebo-headless:1.14.3
    # 開發鷹架：僅在 COMPOSE_PROFILES=sim（開發 .env）時隨 up -d 啟動；
    # 真機部署的 .env 沒有這行，`docker compose up -d` 天生不會帶起模擬器。
    profiles: ["sim"]
    network_mode: host
    # 必須明確指定 MAVLink 目標 IP（14540 給 backend、14550 給 QGroundControl）。
    # 映像預設拿「預設閘道」當目標，那是為 bridge 網路設計的（閘道=docker host）；
    # 在 host network 下閘道會變成區網 router，封包就飛到別台機器去了。見 issues/005。
    # 兩個目標：backend 與 QGC。開發時要讓別台電腦的 QGC 連本機 SITL：
    #   SITL_QGC_HOST=<那台IP> docker compose up -d sitl   （臨時環境變數即可，不進 .env）
    command: ["${SITL_BACKEND_HOST:-127.0.0.1}", "${SITL_QGC_HOST:-127.0.0.1}"]
    # 必須掛 TTY：沒有 TTY 時 PX4 的互動式 shell 讀 stdin 立刻 EOF，
    # 會以最高速無限重畫提示字元（pxh> + ESC[K），把磁碟寫爆。見 issues/009。
    stdin_open: true
    tty: true
    # 第二道防線：Docker 預設的 json-file driver 沒有大小上限。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

  # 開發即在 container 內跑（掛原始碼 + reload）：dev server 的存活不再依賴
  # 任何終端 session，機器重開也會自己回來（restart: unless-stopped）。
  uav-backend:
    container_name: uav-backend
    build:
      context: .                       # repo 根：映像要裝得到共用的 libs/autopilot
      dockerfile: apps/backend/Dockerfile
    network_mode: host          # 直接收 SITL 的 UDP；API 服務於 :${BACKEND_PORT:-38000}
    # **基底＝生產形：沒有 `--reload`、不掛原始碼**（issues/033 §4.1，
    # 2026-09-01 使用者裁定）。原本兩者都寫在這裡，於是**存一個檔案就會重啟
    # 服務**——不需要有人下 restart 指令。熱重載搬到 docker-compose.dev.yml，
    # 由 .env 的 COMPOSE_FILE 啟用；部署環境沒有那行。
    # graceful shutdown 上限留著：它也界定 `docker compose restart` 的長度，
    # 而前端的 /ws/telemetry 是常駐 WS、不會自己關。
    command: ["uvicorn", "app.main:app",
              "--timeout-graceful-shutdown", "3",
              "--host", "0.0.0.0", "--port", "${BACKEND_PORT:-38000}"]
    volumes:
      - ./reference/px4-events:/srv/reference/px4-events:ro   # PX4 事件字典（014）
      # 簽章金鑰（issues/040 A5-b）。**獨立 volume、不與位址表共用**：
      # 一個是設定、一個是秘密，混在一起的下場是備份與除錯時一起被帶走。
      # **不放映像**（映像會被推到 registry）、**不放資料庫**（DB 會被 dump）。
      # 目前只有 backend 掛：command 與 heartbeat 要到 A5-d 真的開簽章才需要，
      # **在那之前不把秘密送進用不到它的容器**
      - signkeys:/state
      - mavcap:/data/mavcap          # 原始層錄製（MAVLink tlog，滾動 30 天）
      - videorec:/rec:ro             # 影像（022）：掃描錄影目錄入庫；唯讀＝寫入是 uav-video 的職責
    environment:
      # 全部由根目錄 .env 供值（見 .env.example）——新環境只改 .env
      DATABASE_URL: postgresql://uav:uav@localhost:${DB_PORT:-35432}/uav
      PYTHONPATH: /srv/libs        # 共用驅動層（libs/autopilot）
      MAVLINK_URL: ${MAVLINK_URL:-udpin://0.0.0.0:14540}
      LINK_SOURCE: ${LINK_SOURCE:-simulated}
      AUTOREGISTER_SIMULATED: ${AUTOREGISTER_SIMULATED:-false}   # SITL/dev true：自動註冊標假機
      GEOFENCE_RADIUS_M: ${GEOFENCE_RADIUS_M:-50}
      GEOFENCE_ALT_M: ${GEOFENCE_ALT_M:-15}
      # 影像（022）：**與 uav-video 用同一個 .env 變數**——錄製器據此清檔、
      # backend 據此回 retention_days 給前端顯示。少傳這行兩邊就會漂移
      # （UI 說 7 天、實際清 14 天），這正是要消滅的假話。
      VIDEO_RETENTION_DAYS: ${VIDEO_RETENTION_DAYS:-7}
      VIDEO_RECORD_ENABLED: ${VIDEO_RECORD_ENABLED:-true}
      VIDEO_REC_DIR: ${VIDEO_REC_DIR:-/rec}
    depends_on:
      uav-db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  # 基底＝部署形：production build（next build 於映像建構完成）+ next start。
  # 開發（熱重載 next dev）由 docker-compose.dev.yml 覆寫，
  # 開發環境的 .env 以 COMPOSE_FILE 啟用之（setup.sh 自動設定）。
  uav-frontend:
    container_name: uav-frontend
    build:
      context: ./apps/frontend
      args:
        # 版本標記（§0.2f）。建置前先取：
        #   export BUILD_SHA="$(git rev-parse --short HEAD)$(git diff --quiet || echo -dirty)"
        # 未設＝空＝UI 顯示「未知版本」（不留白）
        BUILD_SHA: "${BUILD_SHA:-}"
    network_mode: host
    command: ["npm", "run", "start", "--", "-p", "${FRONTEND_PORT:-33000}", "-H", "0.0.0.0"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  # 指令服務（GCS 取代階段 2）：與 ingest 分離的獨立服務，sysid 254。
  # ENABLE_COMMANDS 預設 false——顯式開啟前只觀察不指揮（也不發 GCS 心跳）。
  uav-command:
    container_name: uav-command
    build:
      context: .                       # repo 根：映像要裝得到共用的 libs/autopilot
      dockerfile: apps/command/Dockerfile
    network_mode: host
    # 基底＝生產形，理由同 backend（issues/033 §4.1）。command 這一側更要緊：
    # 它重啟會中斷指令通道，而在心跳解耦之前還會一併中斷 GCS 心跳。
    command: ["uvicorn", "app.main:app",
              # 長請求（任務上傳握手可達 30s）能拖住重啟——上限 3s，行為可預期
              "--timeout-graceful-shutdown", "3",
              "--host", "0.0.0.0", "--port", "${COMMAND_PORT:-38001}"]
    volumes:
      - ./missions:/srv/missions:ro   # 航線檔（外部觸發 GET /api/plans、POST /api/start）；唯讀
      # 位址表：本服務寫、uav-heartbeat 讀（issues/033 §4.2.1）。心跳搬出去之後
      # 「每台機的來源位址」是唯一還需要跨行程傳的東西——而它只有正在收包的
      # 這個服務知道
      - gcsstate:/state
    environment:
      DATABASE_URL: postgresql://uav:uav@localhost:${DB_PORT:-35432}/uav
      PYTHONPATH: /srv/libs        # 共用驅動層（libs/autopilot）
      MISSIONS_DIR: ${MISSIONS_DIR:-/srv/missions}
      COMMAND_MAVLINK_URL: ${COMMAND_MAVLINK_URL:-udpin://0.0.0.0:14541}
      ENABLE_COMMANDS: ${ENABLE_COMMANDS:-false}
      GEOFENCE_ENFORCE: ${GEOFENCE_ENFORCE:-false}
      GEOFENCE_RADIUS_M: ${GEOFENCE_RADIUS_M:-50}
      GEOFENCE_ALT_M: ${GEOFENCE_ALT_M:-15}
    depends_on:
      uav-db: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    restart: unless-stopped

  # ── GCS 心跳（issues/033 §4.2.1；2026-08-31 使用者裁定從 command 搬出）──
  # **與 uav-video 同一個理由**：那邊寫著「錄影不放進 backend，因為 backend 掛
  # --reload、改一行程式就重啟＝錄影中斷」。心跳的後果更嚴重——飛控的 GCS
  # failsafe 盯的就是它，中斷超過 FS_GCS_TIMEOUT（ArduPilot 預設 5s）飛行中的
  # 機體就會自己動作。而 command 的 graceful shutdown 上限就有 3 秒。
  #
  # **刻意不掛原始碼、刻意沒有 --reload**：這個容器存在的唯一理由就是不隨我方的
  # 開發動作重啟。做成跟 command 一樣的形狀等於白做。改它要重建映像，這是特性。
  uav-heartbeat:
    container_name: uav-heartbeat
    build:
      context: .
      dockerfile: apps/command/Dockerfile   # 共用映像：要的是 pymavlink 與 app 套件
    network_mode: host                      # 與 command 同網路命名空間才送得到機
    command: ["python", "-m", "app.hb"]
    volumes:
      - gcsstate:/state:ro                  # 只讀位址表——它不該寫任何東西
    environment:
      GCS_PEERS_PATH: /state/peers.json
      # 幾秒沒更新就當那台機不在了，停止對它發。**停發要看得見**（見 hb.py）
      GCS_PEER_STALE_S: ${GCS_PEER_STALE_S:-30}
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    restart: unless-stopped

  # ── 飛行影像（issue 022；設計見 doc/flight-video-design.md）─────────────
  # 錄影**不放進 backend**：backend 掛 --reload，改一行程式就重啟＝錄影中斷。
  # 這是正式元件（真機部署要錄影），故不加 profile；測試來源才是鷹架（見下）。
  uav-video:
    container_name: uav-video
    image: bluenviron/mediamtx:latest
    network_mode: host          # 收機上 RTSP（跨 5G）＋供瀏覽器 WHEP
    volumes:
      - ./video/mediamtx.yml:/mediamtx.yml:ro
      - videorec:/rec           # 錄影檔；保留天數見下方 env（單一事實源）
    environment:
      # **保留天數的單一事實源**＝這個 .env 變數：同時餵給錄製器（清檔）與
      # backend（API 回 retention_days 給前端顯示空態句）。分成兩處寫死就會漂移
      # ——UI 顯示「7 天」而實際清 14 天這種假話，正是要避免的。
      MTX_PATHDEFAULTS_RECORDDELETEAFTER: ${VIDEO_RETENTION_DAYS:-7}d
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    restart: unless-stopped

  # 測試影像來源（開發鷹架，同 uav-sitl 的隔離做法）：真機部署的 .env 沒有
  # COMPOSE_PROFILES=sim，`docker compose up -d` 天生不會帶起它。
  # -re＝照真實時間推流；沒有它會瞬間灌完，時間錨點直接失真（設計 §5）。
  # 三台各一條，畫面上打 UAV-N 大字＋不同底色——使用者切機時要能**一眼確認
  # 畫面真的換了**（三個一模一樣的測試圖樣看起來像沒切換，等於白測）。
  uav-video-testsrc-1:
    <<: &testsrc-base
      container_name: uav-video-testsrc-1
      image: linuxserver/ffmpeg:latest
      profiles: ["sim"]
      network_mode: host
      entrypoint: ["ffmpeg"]
      depends_on: [uav-video]
      logging:
        driver: json-file
        options: { max-size: "10m", max-file: "2" }
      restart: unless-stopped
    command: >-
      -re -f lavfi -i testsrc2=size=1280x720:rate=15
      -vf drawtext=text='UAV-1':fontsize=96:fontcolor=white:x=60:y=60:box=1:boxcolor=0x1e88e5@0.85:boxborderw=20
      -c:v libx264 -preset veryfast -tune zerolatency -g 30 -pix_fmt yuv420p
      -f rtsp rtsp://127.0.0.1:8554/uav-1

  uav-video-testsrc-2:
    <<: *testsrc-base
    container_name: uav-video-testsrc-2
    command: >-
      -re -f lavfi -i testsrc2=size=1280x720:rate=15
      -vf drawtext=text='UAV-2':fontsize=96:fontcolor=white:x=60:y=60:box=1:boxcolor=0x43a047@0.85:boxborderw=20
      -c:v libx264 -preset veryfast -tune zerolatency -g 30 -pix_fmt yuv420p
      -f rtsp rtsp://127.0.0.1:8554/uav-2

  uav-video-testsrc-3:
    <<: *testsrc-base
    container_name: uav-video-testsrc-3
    command: >-
      -re -f lavfi -i testsrc2=size=1280x720:rate=15
      -vf drawtext=text='UAV-3':fontsize=96:fontcolor=white:x=60:y=60:box=1:boxcolor=0xe53935@0.85:boxborderw=20
      -c:v libx264 -preset veryfast -tune zerolatency -g 30 -pix_fmt yuv420p
      -f rtsp rtsp://127.0.0.1:8554/uav-3

volumes:
  dbdata:
  mavcap:
  videorec:
  gcsstate:      # command 寫、uav-heartbeat 讀的位址表（issues/033 §4.2.1）
  signkeys:      # 簽章金鑰（issues/040 A5-b）。只有 backend 掛，權限 0600
