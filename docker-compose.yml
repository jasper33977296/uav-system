services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: uav
      POSTGRES_PASSWORD: uav
      POSTGRES_DB: uav
    ports:
      # host port 由根目錄 .env 的 DB_PORT 決定（見 scripts/setup.sh；一律 30000 以上）
      - "${DB_PORT:-35432}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uav"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # PX4 SITL (headless Gazebo)。host network 讓 MAVLink UDP 直接打到本機 14540/14550
  sitl:
    image: jonasvautherin/px4-gazebo-headless:1.14.3
    network_mode: host
    # 必須明確指定 MAVLink 目標 IP（14540 給 backend、14550 給 QGroundControl）。
    # 映像預設拿「預設閘道」當目標，那是為 bridge 網路設計的（閘道=docker host）；
    # 在 host network 下閘道會變成區網 router，封包就飛到別台機器去了。見 issues/005。
    command: ["${SITL_BACKEND_HOST:-127.0.0.1}", "${SITL_QGC_HOST:-127.0.0.1}"]
    # 必須掛 TTY：沒有 TTY 時 PX4 的互動式 shell 讀 stdin 立刻 EOF，
    # 會以最高速無限重畫提示字元（pxh> + ESC[K），把磁碟寫爆。見 issues/009。
    stdin_open: true
    tty: true
    # 第二道防線：Docker 預設的 json-file driver 沒有大小上限。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped

  # 開發即在 container 內跑（掛原始碼 + reload）：dev server 的存活不再依賴
  # 任何終端 session，機器重開也會自己回來（restart: unless-stopped）。
  backend:
    build: ./backend
    network_mode: host          # 直接收 SITL 的 UDP；API 服務於 :${BACKEND_PORT:-38000}
    command: ["uvicorn", "app.main:app", "--reload",
              "--host", "0.0.0.0", "--port", "${BACKEND_PORT:-38000}"]
    volumes:
      - ./backend/app:/srv/app  # 原始碼掛進去，改檔案 reload 立即生效
    environment:
      # 全部由根目錄 .env 供值（見 .env.example）——新環境只改 .env
      DATABASE_URL: postgresql://uav:uav@localhost:${DB_PORT:-35432}/uav
      MAVLINK_URL: ${MAVLINK_URL:-udpin://0.0.0.0:14540}
      DRONE_NAME: ${DRONE_NAME:-sim-uav-1}
      LINK_SOURCE: ${LINK_SOURCE:-simulated}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

  frontend:
    image: node:24-bookworm     # 對齊主機的 node 24（node_modules 是 bind mount 共用的）
    network_mode: host
    working_dir: /app
    volumes:
      - ./frontend:/app
    # 用主機的 uid 跑，否則 .next/ 會被寫成 root 擁有，主機端 npm 之後會炸
    user: "1000:1000"
    environment:
      HOME: /tmp
    command: ["npm", "run", "dev", "--", "--port", "${FRONTEND_PORT:-33000}", "-H", "0.0.0.0"]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

volumes:
  dbdata:
