<title>UAV 即時監控 v2</title>
<style>
/* ── tokens：沿用 doc/design-tokens.md（深色為預設與設計基準）。
   淺色仍是手動 opt-in（<html data-theme="light">），不跟隨 OS——
   跟隨 OS 會讓亮色系統的操作員拿到亮面板配深地圖的拼裝畫面。 */
:root{
  color-scheme:dark;
  --page:#1b1a17; --surface:#262624; --surface-2:#30302c;
  --ink:#f0eee6; --ink-2:#c2bfb3; --muted:#8f8b80; --hairline:#3a3833;
  --border:rgba(240,238,230,.1);
  --accent:#d97757; --accent-bg:rgba(217,119,87,.12);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --ok:#0ca30c; --warn:#fab219; --serious:#e05e0e; --danger:#a01818;
  --danger-ink:#e05e5e;
  --sinr-good:#0ca30c; --sinr-fair:#fab219; --sinr-bad:#e05e0e; --sinr-crit:#a01818;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  color-scheme:light;
  --page:#faf9f5; --surface:#fff; --surface-2:#f0eee6;
  --ink:#1a1915; --ink-2:#57544a; --muted:#8f8b80; --hairline:#e6e3da;
  --border:rgba(26,25,21,.1); --accent:#cc785c; --series-1:#2a78d6;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Noto Sans TC","Segoe UI",sans-serif;
  background:var(--page); color:var(--ink); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num,.tnum{font-variant-numeric:tabular-nums}

/* ── shell ─────────────────────────────────────────────── */
.shell{height:100dvh;display:flex;flex-direction:column;background:var(--page)}
.nav{
  flex:none;height:46px;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--surface);border-bottom:1px solid var(--hairline);
}
.brand{font-size:13px;font-weight:700;letter-spacing:.02em}
.navtabs{display:flex;gap:2px}
.navtabs button{
  padding:5px 9px;border-radius:6px;color:var(--muted);display:grid;place-items:center;
}
.navtabs button[aria-current="true"]{color:var(--accent);background:var(--accent-bg)}
.navtabs button:hover{color:var(--ink)}
.spacer{flex:1}
.reclight{display:inline-flex;align-items:center;gap:6px}
.recdot{width:11px;height:11px;border-radius:50%;background:var(--muted)}
.recdot.on{background:#d03b3b;animation:breath 1.6s ease-in-out infinite}
.rectxt{font-size:12px;color:var(--muted)}
.rectxt.on{color:#d03b3b;font-weight:600}
@keyframes breath{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.recdot.on{animation:none}}


/* ── 主版面 ─────────────────────────────────────────────── */
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,27vw,392px)}
@media (max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:minmax(260px,46%) minmax(0,1fr)}}
.mapwrap{position:relative;min-height:0;background:#14181c;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}

/* 機隊：色點永遠配文字（ui-spec 硬規則——顏色不單獨傳達身分） */
.fleet{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:1px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;
  box-shadow:0 4px 16px rgba(0,0,0,.35);max-width:290px}
.fleetrow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;
  color:var(--ink-2);width:100%;text-align:left}
.fleetrow:hover{background:var(--surface-2)}
.fleetrow[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.fleetrow .dot{width:9px;height:9px;border-radius:50%;flex:none}
.fleetrow .dot.hollow{background:none!important;border:1.5px solid var(--muted)}
.fleetrow .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.fleetrow .st{font-size:11px;color:var(--muted);white-space:nowrap}

.legend{position:absolute;left:12px;bottom:52px;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;padding:7px 10px;
  box-shadow:0 4px 16px rgba(0,0,0,.35);display:flex;align-items:center;gap:10px;font-size:11px}
.legend .lab{color:var(--muted)}
.legend .seg{display:flex;align-items:center;gap:5px;color:var(--ink-2)}
.legend .sw{width:14px;height:6px;border-radius:2px}

.hud{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;
  display:flex;align-items:center;gap:16px;padding:7px 15px;border-radius:12px;
  background:rgba(38,38,36,.92);border:1px solid var(--border);
  box-shadow:0 4px 16px rgba(0,0,0,.4)}
.hud .item{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);font-size:12px}
.hud .v{font-family:var(--mono);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.hud.stale .v{color:var(--muted)}
.sigbars{display:inline-flex;align-items:flex-end;gap:2px;height:15px;position:relative}
.sigbars i{width:3px;border-radius:1px;display:block}
.sigslash{position:absolute;left:-2px;right:-2px;top:50%;height:1.5px;background:var(--muted);transform:rotate(-32deg)}
.batt{width:26px;height:12px;border:1.5px solid var(--ink-2);border-radius:3px;padding:1px;position:relative}
.batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--ink-2);border-radius:0 1px 1px 0}
.batt i{display:block;height:100%;border-radius:1px}
.stalebar{position:absolute;left:50%;transform:translateX(-50%);bottom:58px;
  background:rgba(160,24,24,.92);color:#fff;padding:5px 12px;border-radius:8px;font-size:12px;
  border:1px solid rgba(255,255,255,.15);white-space:nowrap}
.scalebar{position:absolute;right:12px;bottom:14px;font-size:11px;color:var(--ink-2);
  display:flex;align-items:center;gap:6px}
.scalebar .bar{height:6px;border:1px solid var(--ink-2);border-top:none}

/* ── 側欄 ───────────────────────────────────────────────── */
.panel{background:var(--page);border-left:1px solid var(--hairline);
  padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:0}
@media (max-width:900px){.panel{border-left:none;border-top:1px solid var(--hairline)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px}
.card.grow{flex:1;min-height:190px;display:flex;flex-direction:column}
.card h3{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.card h3 .spacer{flex:1}

/* ⓘ：常駐版面上不再有解說句，解釋住這裡 */
.info{width:15px;height:15px;border-radius:50%;border:1px solid var(--hairline);
  color:var(--muted);font-size:10px;display:grid;place-items:center;position:relative;flex:none;cursor:help}
.info:hover,.info:focus-visible{color:var(--ink);border-color:var(--border)}
.info::after{
  content:attr(data-tip);position:absolute;right:0;top:19px;width:250px;z-index:40;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.6;text-align:left;
  box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .12s}
.info:hover::after,.info:focus-visible::after{opacity:1;visibility:visible}

/* 機況：一行密度，label 弱、值強 */
.conflict{display:flex;align-items:center;gap:8px;margin-top:9px;padding:6px 9px;border-radius:8px;
  background:rgba(250,178,25,.09);border:1px solid rgba(250,178,25,.3);font-size:11.5px;color:var(--ink-2)}
.conflict b{color:var(--warn);font-weight:600}
.conflict span{color:var(--muted)}
.conflict .info{margin-left:auto}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px}
.fact{display:flex;align-items:baseline;gap:5px}
.fact .k{font-size:11px;color:var(--muted)}
.fact .v{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.fact .v.dim{color:var(--muted)}

/* 訊號 */
.hero{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.hero .n{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.hero .u{font-size:12px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  background:var(--surface-2);font-size:11px;color:var(--ink-2)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.spark{width:100%;height:46px;display:block;margin:6px 0 2px}
.sparkfoot{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.metric .k{font-size:10px;color:var(--muted);letter-spacing:.03em}
.metric .v{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.metric .v small{font-size:10px;color:var(--muted);margin-left:2px}
details.sub{margin-top:9px;border-top:1px solid var(--hairline);padding-top:8px}
details.sub summary{font-size:11px;color:var(--muted);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
details.sub summary::-webkit-details-marker{display:none}
details.sub summary::before{content:"▸";font-size:9px;color:var(--muted)}
details.sub[open] summary::before{content:"▾"}
details.sub summary:hover{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin-top:8px;font-size:11px}
.kv .k{color:var(--muted)}
.kv .v{color:var(--ink-2);font-family:var(--mono);word-break:break-all}
pre.raw{margin-top:7px;background:var(--page);border:1px solid var(--hairline);border-radius:7px;
  padding:8px;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);
  white-space:pre-wrap;word-break:break-all;max-height:190px;overflow:auto}

/* 事件流 */
.evtools{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.pill{padding:2px 8px;border-radius:6px;border:1px solid transparent;color:var(--muted);font-size:11px}
.pill:hover{color:var(--ink-2)}
.pill[aria-pressed="true"]{color:var(--ink);background:var(--surface-2);border-color:var(--border)}
.evlist{flex:1;overflow-y:auto;min-height:0;margin:0 -4px;padding:0 4px}
.evrow{width:100%;display:grid;grid-template-columns:9px 46px 1fr auto;gap:8px;align-items:start;
  padding:5px 4px;border-radius:7px;text-align:left;border-bottom:1px solid rgba(58,56,51,.5)}
.evrow:hover{background:var(--surface-2)}
.evrow .dot{width:7px;height:7px;border-radius:50%;margin-top:5px}
.evrow time{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;margin-top:1px}
.evrow .tx{font-size:12px;color:var(--ink-2);word-break:break-word}
.evrow.crit .tx{color:#f0a5a5}
.evrow .tx .src{font-size:10px;color:var(--muted);margin-right:5px}
.evrow .tx .cmd{color:var(--accent);font-weight:600;margin-right:5px}
.evrow .agg{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-top:1px}
.count{font-size:10.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);
  border-radius:999px;padding:0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.density{height:9px;width:64px;display:block}
.evdetail{padding:2px 4px 10px 63px}
.evdetail .kv{margin-top:2px}
.steps{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.step{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--border);color:var(--ink-2)}
.step b{font-family:var(--mono);font-weight:600}
.empty{color:var(--muted);font-size:12px;padding:12px 2px}

/* 紀錄卡 */
.logline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.logline .f{font-family:var(--mono);color:var(--ink)}
.logline .sep{color:var(--hairline)}
.btn{padding:4px 11px;border:1px solid var(--hairline);border-radius:7px;color:var(--ink-2);
  background:var(--surface-2);font-size:12px}
.btn:hover{color:var(--ink);border-color:var(--border)}
.btn.primary{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}
.logactions{display:flex;gap:7px;margin-top:9px;align-items:center}

.evsheet{width:min(680px,94vw)}
.evsheet .sheethead h2{font-size:14px;line-height:1.55;word-break:break-word;max-width:100%}
.evsheet .evdetail{padding:0}
.evsheet pre.raw{max-height:340px}
.evsheet .kv{grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px}
.evsheet .steps{margin-top:0;margin-bottom:10px}

/* ── log 索引 sheet ─────────────────────────────────────── */
.mask[hidden]{display:none}
.mask{position:fixed;inset:0;background:rgba(12,11,9,.62);z-index:50;display:grid;place-items:center;padding:22px}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  width:min(1040px,96vw);max-height:92dvh;display:flex;flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,.55);overflow:hidden}
.sheethead{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--hairline);flex-wrap:wrap}
.sheethead h2{font-size:14px;font-weight:600}
.sheethead .meta{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.tabs{display:flex;gap:3px;padding:8px 16px 0;border-bottom:1px solid var(--hairline)}
.tabs button{padding:6px 12px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink-2)}
.sheetbody{overflow:auto;padding:14px 16px 18px;min-height:0}
.searchrow{display:flex;gap:9px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.searchrow input{background:var(--page);border:1px solid var(--hairline);border-radius:7px;
  padding:5px 9px;font-size:12px;min-width:190px;flex:1;max-width:280px}
.searchrow .hint{font-size:11px;color:var(--muted)}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
table.tbl th{text-align:left;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;
  padding:0 8px 6px;border-bottom:1px solid var(--hairline);white-space:nowrap}
table.tbl td{padding:5px 8px;border-bottom:1px solid rgba(58,56,51,.55);color:var(--ink-2);vertical-align:top}
table.tbl td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl tr.tap{cursor:pointer}
table.tbl tr.tap:hover td{background:var(--surface-2)}
.tname{font-family:var(--mono);color:var(--ink);font-size:12px}
.arrow{color:var(--muted);font-size:10px}
.fieldsbox{background:var(--page);border:1px solid var(--hairline);border-radius:8px;padding:9px 11px;margin:2px 0 8px}
.fieldsbox .kv{grid-template-columns:auto 1fr;font-size:11px}
.stlist{display:flex;flex-direction:column;gap:1px}
.strow{display:grid;grid-template-columns:9px 66px 1fr;gap:9px;align-items:start;padding:6px 4px;
  border-bottom:1px solid rgba(58,56,51,.55)}
.strow time{font-family:var(--mono);font-size:11px;color:var(--muted)}
.strow .t{font-size:12.5px;color:var(--ink-2);font-family:var(--mono)}
.strow .dot{width:7px;height:7px;border-radius:50%;margin-top:5px}
.chartblock{margin-bottom:16px}
.chartblock h4{font-size:11.5px;color:var(--ink-2);font-weight:600;margin-bottom:2px;display:flex;gap:8px;align-items:baseline}
.chartblock h4 span{color:var(--muted);font-weight:400;font-size:11px}
.chartblock svg{width:100%;height:104px;display:block}
.modeband{width:100%;height:38px;display:block}
.note code{font-family:var(--mono);font-size:10.5px;background:var(--page);border:1px solid var(--hairline);border-radius:4px;padding:0 4px}
.note{font-size:11px;color:var(--muted);line-height:1.7;margin-top:10px;border-top:1px solid var(--hairline);padding-top:9px}
</style>

<div class="shell">
  <nav class="nav">
    <span class="brand">UAV 監控</span>
    <div class="navtabs">
      <button aria-current="true" title="即時監控">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg>
      </button>
      <button title="無人機">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5.5" cy="5.5" r="2.4"/><circle cx="18.5" cy="5.5" r="2.4"/><circle cx="5.5" cy="18.5" r="2.4"/><circle cx="18.5" cy="18.5" r="2.4"/><rect x="10" y="10" width="4" height="4" rx="1.4"/></svg>
      </button>
      <button title="路徑管理">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19c6 0 2-10 8-10 5 0 3 7 8 5"/></svg>
      </button>
      <button title="資訊">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7.5l9-4.5 9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></svg>
      </button>
    </div>
    <span class="spacer"></span>
    <span class="reclight" id="reclight">
      <span class="recdot"></span><span class="rectxt">未記錄</span>
    </span>
  </nav>

  <main class="app">
    <section class="mapwrap">
      <svg id="map" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="fleet" id="fleet"></div>
      <div class="legend">
        <span class="lab">鏈路</span>
        <span class="seg"><i class="sw" style="background:var(--sinr-good)"></i>良好</span>
        <span class="seg"><i class="sw" style="background:var(--sinr-fair)"></i>尚可</span>
        <span class="seg"><i class="sw" style="background:var(--sinr-bad)"></i>劣化</span>
        <span class="seg"><i class="sw" style="background:var(--sinr-crit)"></i>瀕斷</span>
        <span class="seg" style="margin-left:4px"><i class="sw" style="background:repeating-linear-gradient(90deg,var(--ink-2) 0 3px,transparent 3px 6px)"></i>補傳</span>
        <span class="info" tabindex="0" data-tip="彩帶＝即時遙測，依當時 SINR 上色（門檻同 backend：良好 ≥13、尚可 5–13、劣化 −2–5、瀕斷 −2 dB 以下）。虛線＝機上補傳的樣本，另一個來源，所以不與彩帶相連。顏色永不單獨傳達語意。">ⓘ</span>
      </div>
      <div class="hud" id="hud"></div>
      <div class="stalebar" id="stalebar" hidden></div>
      <div class="scalebar" id="scalebar"></div>
    </section>

    <aside class="panel">
      <article class="card">
        <h3>pi5-sdmodelh7v2-ardu<span class="spacer"></span>
          <span class="info" tabindex="0" data-tip="這一列只放「會變、且看一眼就要知道」的事實。機型、板號、韌體版本這類幾乎不變的欄位在無人機頁，不佔即時畫面。">ⓘ</span>
        </h3>
        <div class="facts" id="facts"></div>
      </article>

      <article class="card">
        <h3>訊號<span class="spacer"></span>
          <span class="info" tabindex="0" data-tip="粗線＝2 秒滑動平均，細線＝原始樣本，虛線＝良好門檻 13 dB。誠實原則禁止只畫平滑線——平滑只影響繪製，不產生量測點之間的假值。">ⓘ</span>
        </h3>
        <div id="sigbody"></div>
      </article>

      <article class="card grow">
        <h3>事件<span id="evcount" class="spacer" style="color:var(--muted);font-weight:400"></span>

,27],[423.6,27],[425.3,27],[427.1,27],[428.8,27],[430.6,27],[432.3,27],[434.1,27],[435.8,27],[437.6,27],[439.3,27],[441.1,27],[442.8,27],[444.6,27],[446.3,27],[448.1,27],[449.8,27],[451.6,27],[453.3,27],[455.1,27],[456.6,27],[458.3,27],[460.1,27],[461.8,27],[463.6,27],[465.3,27],[467.1,27],[468.8,27],[470.6,27],[472.3,27],[474.1,27],[475.8,27],[477.6,27],[479.3,27],[481.1,27],[483.1,27],[484.8,27],[486.6,27],[488.3,27],[490.1,27],[491.8,27],[493.6,27],[495.3,27],[497.1,27],[498.6,26],[500.3,26],[502.1,27],[503.8,27],[505.6,26],[507.3,26],[509.1,27],[510.8,27],[512.6,26],[514.3,26],[516.1,26],[517.8,26],[519.6,26],[521.3,26],[523.1,27],[524.8,27],[526.6,27],[528.3,27],[530.1,27],[531.8,27],[533.6,27],[535.3,27],[537.1,27],[538.8,27],[540.3,27],[542.1,27],[543.8,27],[545.6,27],[547.3,27],[549.1,27],[550.8,27],[552.6,27],[554.3,27],[556.1,27],[557.8,27],[559.6,27],[561.3,27],[563.1,27],[564.8,27],[566.6,27],[568.3,27],[570.1,27],[571.8,27],[573.6,27],[575.3,27],[577.1,27],[578.8,27],[580.6,27],[582.1,27],[583.8,27],[585.6,27],[587.3,27],[589.1,27],[590.8,28],[592.6,28],[594.3,28],[596.1,28],[597.8,28],[599.6,28],[601.3,28],[603.1,29],[604.8,29],[606.6,29],[608.3,29],[610.1,29],[611.8,29],[613.6,29],[615.3,29],[617.1,29],[618.8,29],[620.6,29]]},"flight_t0":533.2,"flight_t1":622.2},"dbstats":{"events_total":21012,"critical":15108,"warn":292,"top":[["PreArm: GPS 1: Bad fix",2788],["PreArm: Radio failsafe on",2600],["PreArm: RC not found",2390],["PreArm: Battery 1 low voltage failsafe",1089]]}};</script>
<script>
(function(){
"use strict";
const P = window.PROTO, W = P.window, F = P.flight, LOG = P.log;
const $ = (s)=>document.querySelector(s);
const el = (t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};

/* ── 時間 ────────────────────────────────────────────── */
const TZ = new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",hour12:false,
  hour:"2-digit",minute:"2-digit",second:"2-digit"});
const absClock = (t)=>TZ.format(new Date((W.t0+t)*1000));
function relClock(t){                       // 相對「開始記錄」，帶正負號
  const d = t - F.start, s = d<0?"−":"+", a = Math.abs(d);
  return s + String(Math.floor(a/60)).padStart(2,"0") + ":" + String(Math.floor(a%60)).padStart(2,"0");
}
const ageText = (s)=> s<60 ? `${Math.round(s)} 秒前`
  : s<3600 ? `${Math.floor(s/60)} 分 ${Math.round(s%60)} 秒前` : `${(s/3600).toFixed(1)} 小時前`;
const mb = (b)=> b>=1e9 ? (b/1e9).toFixed(2)+" GB" : (b/1e6).toFixed(1)+" MB";
const dur = (s)=> s>=60 ? `${Math.floor(s/60)} 分 ${Math.round(s%60)} 秒` : `${Math.round(s)} 秒`;

/* ── SINR 分級（門檻＝backend 事件門檻）───────────────── */
const CLASSES = [
  {key:"good",  label:"良好", color:"var(--sinr-good)", min:13},
  {key:"fair",  label:"尚可", color:"var(--sinr-fair)", min:5},
  {key:"bad",   label:"劣化", color:"var(--sinr-bad)",  min:-2},
  {key:"crit",  label:"瀕斷", color:"var(--sinr-crit)", min:-Infinity}];
const classify = (v)=> CLASSES.find(c=>v>=c.min) || CLASSES[3];
const BARS = {good:4,fair:3,bad:2,crit:1};
const SEV = {critical:"var(--danger)", warning:"var(--warn)", warn:"var(--warn)", info:"var(--muted)"};

/* ── 狀態 ────────────────────────────────────────────── */
const S = {t:104, playing:true, speed:8, fold:true, sev:"all", src:"all", openEv:null,
           open:new Set(), sheet:null, sheetTab:"types", q:""};

/* ── 取樣：目前時刻的遙測／鏈路 ────────────────────────── */
const TELE = P.tele.filter(r=>r.lat!=null&&r.lon!=null);
// **即時樣本與機上補傳樣本不是同一條軌跡。** 這趟兩者在同一批時間戳上
// 彼此矛盾（即時：AUTO、3.1 m；補傳：LOITER、−0.4 m，相距 31 m），
// 接成一條折線等於斷言「機從 A 飛到 B」——那是畫面自己生出來的事實
const LIVE = TELE.filter(r=>!r.bf), BF = TELE.filter(r=>r.bf);
function teleAt(t){          // 「現在的狀態」只採即時樣本
  let i=-1; for(let k=0;k<LIVE.length;k++){ if(LIVE[k].t<=t) i=k; else break; }
  return i<0 ? null : LIVE[i];
}
function bfAt(t){            // 同一時刻的補傳樣本（有就要說，不能默默蓋掉）
  let best=null;
  for(const r of BF){ if(Math.abs(r.t-t)<2 && (!best||Math.abs(r.t-t)<Math.abs(best.t-t))) best=r; }
  return best;
}
const metersBetween=(a,b)=>{
  const mLon=111320*Math.cos(a.lat*Math.PI/180);
  return Math.hypot((b.lon-a.lon)*mLon,(b.lat-a.lat)*111320);
};
function linkAt(t){
  let i=-1; for(let k=0;k<P.link.length;k++){ if(P.link[k].t<=t) i=k; else break; }
  return i<0 ? null : P.link[i];
}
const armedAt = (t)=> t>=F.start && t<=F.end;

/* ── 3D 視角（沿用舊版定案：傾斜視角＋地面網格＋起飛點錨定；
   實際路徑＝懸浮在飛行高度、依 SINR 上色的彩帶，地面留淡色投影；
   機體＝正圓球體）──────────────────────────────────────── */
const V = (()=>{
  const home = (TELE.find(p=>!p.bf) || TELE[0]);
  const mLon = 111320*Math.cos(home.lat*Math.PI/180), mLat = 111320;
  const PIT = 55*Math.PI/180, BRG = 28*Math.PI/180;
  const cb=Math.cos(BRG), sb=Math.sin(BRG), cp=Math.cos(PIT), sp=Math.sin(PIT);
  const en   = (lat,lon)=>[(lon-home.lon)*mLon, (lat-home.lat)*mLat];
  const proj = (e,n,u)=>{ const X=e*cb+n*sb, Y=-e*sb+n*cb; return [X, -Y*cp-(u||0)*sp]; };
  const G = 30;                                  // 網格半徑（m）
  const pts=[];
  TELE.forEach(p=>{ const [e,n]=en(p.lat,p.lon);
    pts.push(proj(e,n,p.alt||0)); pts.push(proj(e,n,0)); });
  [[-G,-G],[G,-G],[-G,G],[G,G]].forEach(([e,n])=>pts.push(proj(e,n,0)));
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  const pad=54;
  const k=Math.min((1000-pad*2)/(maxX-minX),(700-pad*2)/(maxY-minY));
  const ox=(1000-(maxX-minX)*k)/2-minX*k, oy=(700-(maxY-minY)*k)/2-minY*k;
  const put=(x,y)=>[x*k+ox, y*k+oy];
  return { home, G, k,
    at:(lat,lon,u)=>{ const [e,n]=en(lat,lon); const [x,y]=proj(e,n,u); return put(x,y); },
    ground:(e,n)=>{ const [x,y]=proj(e,n,0); return put(x,y); } };
})();

/* ── 地圖繪製 ────────────────────────────────────────── */
function drawMap(){
  const svg=$("#map"), t=S.t, ns="http://www.w3.org/2000/svg";
  svg.textContent="";
  const g=(tag,attrs)=>{const n=document.createElementNS(ns,tag);
    for(const k in attrs) n.setAttribute(k,attrs[k]); return n;};
  const defs=g("defs",{});
  defs.innerHTML = `<radialGradient id="sph" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".38"/></radialGradient>`;
  svg.appendChild(defs);

  // 地面網格 10 m（起飛點錨定）——沒有底圖時距離感全靠它
  const grid=g("g",{stroke:"#232a2f","stroke-width":1});
  for(let e=-V.G;e<=V.G;e+=10){
    const a=V.ground(e,-V.G), b=V.ground(e,V.G);
    grid.appendChild(g("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1]})); }
  for(let n=-V.G;n<=V.G;n+=10){
    const a=V.ground(-V.G,n), b=V.ground(V.G,n);
    grid.appendChild(g("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1]})); }
  svg.appendChild(grid);

  const pts = LIVE.filter(p=>p.t<=t);

  // 地面投影：淡色，不上分級色（分級色只給實測彩帶）
  if(pts.length>1){
    const dgs = pts.map(p=>V.at(p.lat,p.lon,0).map(v=>v.toFixed(1)).join(",")).join(" ");
    svg.appendChild(g("polyline",{points:dgs,fill:"none",stroke:"var(--muted)",
      "stroke-width":1.6,"stroke-opacity":.32,"stroke-linejoin":"round"}));
  }
  // 垂直落線：把彩帶掛回地面，高度才讀得出來
  const drop=g("g",{stroke:"var(--muted)","stroke-width":1,"stroke-opacity":.16});
  pts.forEach((p,i)=>{ if(i%6 || !p.alt || p.alt<0.4) return;
    const a=V.at(p.lat,p.lon,p.alt), b=V.at(p.lat,p.lon,0);
    drop.appendChild(g("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1]})); });
  svg.appendChild(drop);

  // 懸浮彩帶：逐段依「當時」的 SINR 上色，不插值、不補值
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i], lk=linkAt(b.t), fresh = lk && (b.t-lk.t)<30;
    const A=V.at(a.lat,a.lon,a.alt||0), B=V.at(b.lat,b.lon,b.alt||0);
    svg.appendChild(g("line",{x1:A[0],y1:A[1],x2:B[0],y2:B[1],
      stroke: fresh ? classify(lk.sinr).color : "var(--muted)",
      "stroke-width":5,"stroke-linecap":"round",
      "stroke-opacity": fresh?0.95:0.45}));
  }

  // 機上補傳的樣本：獨立一條虛線，**不與即時軌跡相連**
  const bfp = BF.filter(p=>p.t<=t);
  if(bfp.length>1){
    const pl = bfp.map(p=>V.at(p.lat,p.lon,p.alt||0).map(v=>v.toFixed(1)).join(",")).join(" ");
    svg.appendChild(g("polyline",{points:pl,fill:"none",stroke:"var(--ink-2)",
      "stroke-width":2,"stroke-opacity":.55,"stroke-dasharray":"5 4","stroke-linejoin":"round"}));
    const last=bfp[bfp.length-1], L=V.at(last.lat,last.lon,last.alt||0);
    svg.appendChild(g("circle",{cx:L[0],cy:L[1],r:6,fill:"none",
      stroke:"var(--ink-2)","stroke-width":1.6,"stroke-dasharray":"3 3"}));
    const lb=g("text",{x:L[0]+11,y:L[1]+4,fill:"var(--muted)","font-size":11});
    lb.textContent="補傳"; svg.appendChild(lb);
  }

  // 起飛點（地面）
  const H=V.ground(0,0);
  svg.appendChild(g("ellipse",{cx:H[0],cy:H[1],rx:9,ry:9*Math.cos(55*Math.PI/180),
    fill:"none",stroke:"var(--ink-2)","stroke-width":1.5}));
  const ht=g("text",{x:H[0]+13,y:H[1]+4,fill:"var(--muted)","font-size":11});
  ht.textContent="起飛點"; svg.appendChild(ht);

  // 機體：球體懸浮於實際高度＋地面航向三角（過舊＝空心紅框）
  const cur=teleAt(t);
  if(cur && cur.lat!=null){
    const age=t-cur.t, stale=age>4;
    const A=V.at(cur.lat,cur.lon,cur.alt||0), Gp=V.at(cur.lat,cur.lon,0);
    const lk=linkAt(t), col=(!stale&&lk&&(t-lk.t)<30)?classify(lk.sinr).color:"var(--muted)";
    svg.appendChild(g("line",{x1:A[0],y1:A[1],x2:Gp[0],y2:Gp[1],
      stroke:"var(--ink-2)","stroke-width":1,"stroke-opacity":.35}));
    if(cur.hdg!=null && !stale){
      const a=(90-cur.hdg+28)*Math.PI/180, r=15, sq=Math.cos(55*Math.PI/180);
      const P_=(ang,rr)=>[Gp[0]+Math.cos(ang)*rr, Gp[1]-Math.sin(ang)*rr*sq];
      const p1=P_(a,r), p2=P_(a+2.5,9), p3=P_(a-2.5,9);
      svg.appendChild(g("path",{d:`M${p1} L${p2} L${p3}Z`,
        fill:"var(--ink-2)","fill-opacity":.6}));
    }
    svg.appendChild(g("circle",{cx:A[0],cy:A[1],r:11,fill:stale?"none":col,
      stroke:stale?"var(--danger-ink)":"rgba(0,0,0,.4)","stroke-width":stale?2:1}));
    if(!stale) svg.appendChild(g("circle",{cx:A[0],cy:A[1],r:11,fill:"url(#sph)"}));
    const lab=g("text",{x:A[0]+16,y:A[1]-11,fill:"var(--ink)","font-size":12,"font-weight":600});
    lab.textContent="sysid 1"; svg.appendChild(lab);
    const alt=g("text",{x:A[0]+16,y:A[1]+3,fill:"var(--muted)","font-size":11});
    alt.textContent = stale?"":`${(cur.alt||0).toFixed(1)} m`; svg.appendChild(alt);
  }
  $("#scalebar").innerHTML = `地面網格 10 m · 傾斜 55°`;
}

/* ── HUD ─────────────────────────────────────────────── */
function drawHud(){
  const t=S.t, cur=teleAt(t), lk=linkAt(t), hud=$("#hud");
  const age = cur ? t-cur.t : Infinity;
  const stale = age>4, gone = age>25;
  hud.className = "hud"+(stale?" stale":"");
  hud.textContent="";
  const item=(label,inner)=>{const s=el("span","item"); s.title=label; s.innerHTML=inner; hud.appendChild(s); return s;};
  const dash = '<span class="v">—</span>';
  item("高度（相對起飛點）", "▲"+(cur&&!stale&&cur.alt!=null?`<span class="v">${cur.alt.toFixed(1)}m</span>`:dash));
  item("對地速度", "→"+(cur&&!stale&&cur.gs!=null?`<span class="v">${cur.gs.toFixed(1)}</span>`:dash));
  // 訊號格：形狀先於顏色（失聯＝0 格＋斜線）
  const lkFresh = lk && (t-lk.t)<10 && !stale;
  const cls = lkFresh ? classify(lk.sinr) : null, lvl = cls?BARS[cls.key]:0;
  let bars = '<span class="sigbars">';
  for(let i=1;i<=4;i++) bars += `<i style="height:${3+i*3}px;background:${i<=lvl?cls.color:"var(--hairline)"}"></i>`;
  if(!lkFresh) bars += '<span class="sigslash"></span>';
  bars += "</span>";
  item(lkFresh?`SINR ${lk.sinr} dB`:"沒有新的鏈路量測", bars +
    (lkFresh?`<span class="v">${lk.sinr.toFixed(1)}</span><span style="color:var(--muted);font-size:11px">dB</span>`:""));
  if(cur && cur.batt!=null && !stale){
    item("電量", `<span class="batt"><i style="width:${cur.batt}%;background:${cur.batt<=20?"var(--serious)":"var(--ink-2)"}"></i></span><span class="v">${Math.round(cur.batt)}%</span>`);
  }
  // 過舊：數值被拿掉，年齡取而代之——灰色的「1 m」讀起來還是一個高度
  const sb = $("#stalebar");
  if(gone && cur){ sb.hidden=false; sb.innerHTML = `資訊在 ${ageText(age)}更新`; }
  else if(stale && cur){ sb.hidden=false; sb.innerHTML = `資料延遲 ${ageText(age)}——畫面可能不是最新`; }
  else sb.hidden=true;
  // 記錄燈：語意＝「現在的資料有沒有被記下來」（armed 且有架次）
  const rec = armedAt(t);
  $("#reclight").innerHTML = `<span class="recdot${rec?" on":""}"></span>`+
    `<span class="rectxt${rec?" on":""}">${rec?"記錄中":"未記錄"}</span>`;
  $("#reclight").title = rec ? "記錄中——遙測寫入資料庫（armed 且已建立架次）" : "待機（刻意不入庫）";
}

/* ── 機況 ────────────────────────────────────────────── */
function drawFacts(){
  const t=S.t, cur=teleAt(t), box=$("#facts"); box.textContent="";
  const oldc=box.parentElement.querySelector(".conflict"); if(oldc) oldc.remove();
  const age = cur ? t-cur.t : Infinity;
  const add=(k,v,dim)=>{const f=el("div","fact"); f.appendChild(el("span","k",k));
    const s=el("span","v"+(dim?" dim":"")); s.textContent=v; f.appendChild(s); box.appendChild(f);};
  if(!cur){ add("狀態","尚無遙測",true); return; }
  const old = age>25;
  add("模式", old?"—":cur.mode, old);
  add("鎖", old?"—":(cur.armed?"已解鎖":"上鎖"), old);
  add("GPS", old?"—":`fix ${cur.fix} · ${cur.sats} 顆`, old);
  add("電壓", old||cur.volt==null?"—":cur.volt.toFixed(2)+" V", old);
  add("最後遙測", ageText(age), age>4);
  // **「有兩份不一致的資料」是一個事實**，不是可以擇一顯示的細節
  const bfs = BF.filter(r=>r.t<=t);
  if(bfs.length && cur){
    let n=0, mx=0, other=null;
    for(const r of bfs){ const lv=teleAt(r.t); if(!lv) continue;
      const gp=metersBetween(lv,r); if(gp>5){ n++; if(gp>mx){mx=gp; other=r;} } }
    if(n){
      const w=el("div","conflict");
      w.innerHTML = `<b>這趟有 ${n} 筆機上補傳資料與即時串流不一致</b>`;
      const inf=el("span","info"); inf.tabIndex=0; inf.textContent="ⓘ";
      inf.dataset.tip="即時串流與機上補傳（telemetry.backfilled）在這一段互相矛盾：一份說 AUTO、3 m 在飛，一份說 LOITER、貼地不動。畫面採即時那一份，但不把矛盾藏起來——地圖上那條虛線就是另一份。";
      w.appendChild(inf);
      box.parentElement.appendChild(w);
    }
  }
}

/* ── 訊號卡 ──────────────────────────────────────────── */
function drawSignal(){
  const t=S.t, box=$("#sigbody"), lk=linkAt(t);
  box.textContent="";
  const hist = P.link.filter(r=>r.t<=t).slice(-40);
  const fresh = lk && (t-lk.t)<10;
  const hero = el("div","hero");
  const n = el("span","n"); n.textContent = lk? lk.sinr.toFixed(1) : "—";
  n.style.color = fresh ? "var(--ink)" : "var(--muted)";
  hero.appendChild(n);
  hero.appendChild(el("span","u","dB SINR"));
  if(lk){
    const c=classify(lk.sinr), chip=el("span","chip");
    const d=el("span","dot"); d.style.background=fresh?c.color:"var(--muted)";
    chip.appendChild(d); chip.appendChild(document.createTextNode(fresh?c.label:"最後一筆 "+ageText(t-lk.t)));
    hero.appendChild(chip);
  }
  box.appendChild(hero);

  // sparkline：原始細線＋2s 平滑粗線
  if(hist.length>1){
    const w=320,h=46, vals=hist.map(r=>r.sinr);
    const mn=Math.min(...vals), mx=Math.max(...vals), sp=(mx-mn)||1;
    const X=i=>4+i/(vals.length-1)*(w-8), Y=v=>h-6-((v-mn)/sp)*(h-14);
    const sm=vals.map((_,i)=>{const s=vals.slice(Math.max(0,i-4),i+1); return s.reduce((a,b)=>a+b,0)/s.length;});
    const pts=a=>a.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    box.insertAdjacentHTML("beforeend",
      `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="SINR 近期趨勢">
        <line x1="0" x2="${w}" y1="${Y(13)}" y2="${Y(13)}" stroke="var(--hairline)" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>
        <polyline points="${pts(vals)}" fill="none" stroke="var(--muted)" stroke-width="1" stroke-opacity=".45" vector-effect="non-scaling-stroke"/>
        <polyline points="${pts(sm)}" fill="none" stroke="var(--series-1)" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <circle cx="${X(vals.length-1)}" cy="${Y(vals[vals.length-1])}" r="2.6" fill="var(--series-1)"/>
      </svg>
      <div class="sparkfoot"><span>${hist.length} 筆 · ${dur(hist[hist.length-1].t-hist[0].t)}</span></div>`);
  }
  // 次要數字：三個，其餘進摺疊
  const m = el("div","metrics");
  const met=(k,v,u)=>{const d=el("div","metric"); d.appendChild(el("div","k",k));
    const s=el("div","v"); s.textContent=v; if(u){const sm=el("small",null,u); s.appendChild(sm);} d.appendChild(s); m.appendChild(d);};
  met("RSRP", lk&&lk.rsrp!=null?lk.rsrp.toFixed(0):"—"," dBm");
  met("RTT",  lk&&lk.rtt!=null?lk.rtt.toFixed(0):"—"," ms");
  met("RSRQ", lk&&lk.rsrq!=null?lk.rsrq.toFixed(1):"—"," dB");
  box.appendChild(m);

  // 詳細：欄位由 AT 原始回應解出（資料庫那幾欄是 null）
  const d = lk && lk.dec;
  const det = el("details","sub");
  det.innerHTML = `<summary>Serving cell &amp; band</summary>`;
  const kv = el("div","kv");
  const row=(k,v)=>{kv.appendChild(el("span","k",k)); kv.appendChild(el("span","v",v));};
  if(d){
    row("Band", `${d.band} · ${d.bw} MHz`);
    row("NR-ARFCN", `${d.narfcn} (≈ ${d.narfcn_mhz} MHz)`);
    row("PCI", `${d.pci} (0x${d.pci_hex})`);
    row("NCI", `${d.nci}`);
    row("TAC", `${d.tac}`);
    row("PLMN", `${d.plmn} · ${lk.mode}`);
    row("Source", lk.src+" · AT+GTCCINFO? / AT+CESQ");
  } else row("Status","這一刻沒有鏈路樣本");
  det.appendChild(kv);
  box.appendChild(det);
}

/* ── 事件流：折疊 ────────────────────────────────────── */
function evStream(){
  const t=S.t;
  const evs = P.events.filter(e=>e.t<=t).map(e=>({kind:"ev",...e}));
  const cmds = P.commands.filter(c=>c.t<=t).map(c=>({kind:"cmd",t:c.t,clock:c.clock,
    type:"command", sev:c.result==="accepted"?"info":"warning", src:"system",
    text:`${c.action} · ${c.result==="accepted"?"已執行":c.result}`, cmd:c}));
  let all = evs.concat(cmds).sort((a,b)=>a.t-b.t);
  if(S.sev==="warn") all = all.filter(e=>e.sev!=="info");
  if(S.src!=="all") all = all.filter(e=>S.src==="vehicle" ? e.src==="vehicle" : e.src!=="vehicle");
  return all;
}
function fold(list){
  const map = new Map(), out=[];
  for(const e of list){
    const k = e.kind==="cmd" ? "cmd:"+e.t : e.type+"|"+e.text;
    if(!map.has(k)){ const g={...e, times:[e.t], items:[e]}; map.set(k,g); out.push(g); }
    else { const g=map.get(k); g.times.push(e.t); g.items.push(e); g.t=e.t; g.clock=e.clock; }
  }
  return out.sort((a,b)=>b.t-a.t);
}
function drawEvents(){
  const list = evStream(), rows = S.fold ? fold(list) : list.slice().reverse().map(e=>({...e,times:[e.t],items:[e]}));

  // 工具列
  const tools=$("#evtools"); tools.textContent="";
  const grp=(opts,cur,set)=>{opts.forEach(([k,lab])=>{
    const b=el("button","pill",lab); b.setAttribute("aria-pressed", cur===k?"true":"false");
    b.onclick=()=>{ set(k); render(); }; tools.appendChild(b); });};
  grp([["all","全部"],["warn","警告以上"]], S.sev, k=>S.sev=k);
  tools.appendChild(el("span",null,"")).style.width="6px";
  grp([["all","不分來源"],["vehicle","機上"],["system","系統"]], S.src, k=>S.src=k);
  const f=el("button","pill", S.fold?"折疊：開":"折疊：關");
  f.setAttribute("aria-pressed", S.fold?"true":"false");
  f.title = "關掉折疊＝今天畫面上的樣子";
  f.onclick=()=>{S.fold=!S.fold; render();};
  tools.appendChild(el("span",null,"")).style.flex="1";
  tools.appendChild(f);

  const box=$("#evlist"); box.textContent="";
  if(!rows.length){ box.appendChild(el("div","empty","這段時間沒有事件（不是取不到——取得失敗會另外說）")); return; }
  for(const g of rows){
    const key = g.kind==="cmd" ? "cmd"+g.t : g.type+"|"+g.text;
    const row = el("button","evrow"+(g.sev==="critical"?" crit":""));
    const dot = el("span","dot"); dot.style.background = SEV[g.sev]||SEV.info; row.appendChild(dot);
    const tm = el("time", null, relClock(g.t)); tm.title = absClock(g.t); row.appendChild(tm);
    const tx = el("span","tx");
    if(g.kind==="cmd") tx.appendChild(el("span","cmd","指令"));
    else tx.appendChild(el("span","src", g.src==="vehicle"?"機上":"系統"));
    tx.appendChild(document.createTextNode(g.text.replace(/\*\*/g,"")));
    row.appendChild(tx);
    const agg = el("span","agg");
    if(g.times.length>1){
      const gaps=[]; for(let i=1;i<g.times.length;i++) gaps.push(g.times[i]-g.times[i-1]);
      gaps.sort((a,b)=>a-b);
      const med = gaps[Math.floor(gaps.length/2)];
      const c = el("span","count", `×${g.times.length}`); c.title =
        `${absClock(g.times[0])} – ${absClock(g.t)} · 約每 ${med<60?med.toFixed(0)+" 秒":(med/60).toFixed(1)+" 分"}`;
      agg.appendChild(c);
      // 密度條：每一次發生的時刻，等比例落在起訖之間
      const t0=g.times[0], t1=g.t, span=(t1-t0)||1;
      let ticks=""; for(const x of g.times) ticks += `<line x1="${((x-t0)/span*62+1).toFixed(1)}" x2="${((x-t0)/span*62+1).toFixed(1)}" y1="1" y2="8" stroke="${SEV[g.sev]||SEV.info}" stroke-width="1.4" stroke-opacity=".8"/>`;
      agg.insertAdjacentHTML("beforeend",
        `<svg class="density" viewBox="0 0 64 9" preserveAspectRatio="none" aria-hidden="true">${ticks}</svg>`);
    }
    row.appendChild(agg);
    row.onclick=()=>{ S.openEv=g; renderEvModal(); };
    box.appendChild(row);
  }
}
function evDetail(g){
  const d = el("div","evdetail");
  if(g.kind==="cmd"){
    const c=g.cmd, steps=el("div","steps");
    c.steps.forEach(s=>{
      const b=el("span","step");
      b.innerHTML = `${s.k}：${s.ok?"接受":"未接受"} <b>${s.ms!=null?s.ms.toFixed(0)+"ms":"—"}</b>`
        + (s.tries>1?` · ${s.tries} 次`:"");
      steps.appendChild(b);
    });
    d.appendChild(steps);
    if(c.alt!=null){
      const kv=el("div","kv");
      kv.appendChild(el("span","k","高度參數")); kv.appendChild(el("span","v",`${c.alt} m（${c.sem==="relative"?"相對起飛點":c.sem}）`));
      kv.appendChild(el("span","k","下令者")); kv.appendChild(el("span","v",c.client||"—"));
      d.appendChild(kv);
    }
    const sub=el("details","sub"); sub.innerHTML="<summary>原始回應</summary>";
    sub.appendChild(el("pre","raw", c.raw)); d.appendChild(sub);
    return d;
  }
  const kv=el("div","kv");
  const put=(k,v)=>{kv.appendChild(el("span","k",k)); kv.appendChild(el("span","v",v));};
  put("型別", g.type + "（" + (g.src==="vehicle"?"機上訊息":"系統推導") + "）");
  put("嚴重度", g.sev);
  if(g.times.length>1){
    put("首次", absClock(g.times[0]));
    put("最近", absClock(g.t));
  } else put("時刻", absClock(g.t));
  for(const [k,v] of Object.entries(g.detail||{})){
    if(k==="text"||k==="count") continue;
    put(k, typeof v==="object" ? JSON.stringify(v) : String(v));
  }
  d.appendChild(kv);
  if(g.times.length>1){
    const sub=el("details","sub");
    sub.open = true;
    sub.innerHTML = `<summary>逐則（${g.times.length} 次）</summary>`;
    const p=el("pre","raw", g.times.map(x=>`${absClock(x)}  ${relClock(x)}`).join("\n"));
    sub.appendChild(p); d.appendChild(sub);
  }
  return d;
}

function renderEvModal(){

    const fx=(LOG.flight_t0/fSpan)*192, fw=((LOG.flight_t1-LOG.flight_t0)/fSpan)*192;

  });
  tbl.appendChild(tb); wrap.appendChild(tbl);
  if(!rows.length) wrap.appendChild(el("div","empty","沒有符合的訊息型別"));
}
function sheetText(body){
  const SEVN = {0:"緊急",1:"警報",2:"危急",3:"錯誤",4:"警告",5:"注意",6:"資訊",7:"除錯"};
  const list=el("div","stlist");
  LOG.statustext.forEach(s=>{
    const r=el("div","strow");
    const d=el("span","dot"); d.style.background = s.sev<=3?"var(--danger)":s.sev<=4?"var(--warn)":"var(--muted)";
    r.appendChild(d);
    const tm=el("time",null,s.clock); tm.title=`+${s.t}s`; r.appendChild(tm);
    const t=el("span","t"); t.textContent=s.text;
    const tag=el("span",null,`　${SEVN[s.sev]||s.sev}`); tag.style.color="var(--muted)"; tag.style.fontSize="11px";
    t.appendChild(tag);
    r.appendChild(t); list.appendChild(r);
  });
  body.appendChild(list);
  body.insertAdjacentHTML("beforeend",
    `<div class="note">機上原文不翻譯（event-stream-design 定案）——翻譯會讓「飛控真正說了什麼」不可回溯。
     嚴重度是 MAVLink 的 severity，不是我方判斷。</div>`);
}
function sheetCurves(body){
  // 模式帶
  const band = el("div","chartblock");
  band.innerHTML = "<h4>模式 <span>由 HEARTBEAT 的 custom_mode 還原，切換時才畫一段</span></h4>";
  const segs = LOG.modes.map((m,i)=>({...m, end: i+1<LOG.modes.length?LOG.modes[i+1].t:LOG.span}));
  let s = `<svg class="modeband" viewBox="0 0 1000 38" preserveAspectRatio="none">`;
  const MC = {AUTO:"var(--series-3)",GUIDED:"var(--series-1)",LOITER:"var(--surface-2)",LAND:"var(--series-2)"};
  segs.forEach(g=>{
    const x=g.t/LOG.span*1000, w=(g.end-g.t)/LOG.span*1000;
    s += `<rect x="${x.toFixed(1)}" y="2" width="${Math.max(1,w).toFixed(1)}" height="20" fill="${MC[g.mode]||"var(--surface-2)"}" fill-opacity=".55"/>`;
    if(w>52) s += `<text x="${(x+5).toFixed(1)}" y="16" fill="var(--ink-2)" font-size="10">${g.mode}</text>`;
  });
  const fx=LOG.flight_t0/LOG.span*1000, fw=(LOG.flight_t1-LOG.flight_t0)/LOG.span*1000;
  s += `<rect x="${fx.toFixed(1)}" y="0" width="${fw.toFixed(1)}" height="24" fill="none" stroke="var(--warn)" stroke-width="1"/>`;
  s += `<text x="${fx.toFixed(1)}" y="34" fill="var(--warn)" font-size="10">架次區間 ${F.start_clock}–${F.end_clock}</text>`;
  s += `</svg>`;
  band.insertAdjacentHTML("beforeend", s);
  body.appendChild(band);

  chart(body, LOG.series.alt,  "高度（相對起飛點）", "m", "var(--series-1)");
  chart(body, LOG.series.volt, "電池電壓", "V", "var(--series-3)");
  chart(body, LOG.series.vib,  "振動（三軸最大）", "", "var(--series-2)", [30,60]);
  body.insertAdjacentHTML("beforeend",
    `<div class="note">曲線直接畫原始樣本，不做插值。振動的 30／60 是 PX4 與 ArduPilot 共用的判讀門檻，
     所以它有刻度；其餘兩條沒有權威門檻，就不畫假的參考線。</div>`);
}
function chart(body, data, title, unit, color, refs){
  if(!data || data.length<2) return;
  const W_=1000, H_=104, L=44, R=8, T=10, B=20;
  const xs=data.map(d=>d[0]), ys=data.map(d=>d[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  if(refs) y1=Math.max(y1, refs[refs.length-1]*1.05);
  const padY=(y1-y0)*0.12||1; y0-=padY; y1+=padY;
  const X=v=>L+(v-x0)/(x1-x0)*(W_-L-R);
  const Y=v=>T+(1-(v-y0)/(y1-y0))*(H_-T-B);
  const d = data.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" ");
  const area = d + ` L${X(x1).toFixed(1)} ${Y(y0).toFixed(1)} L${X(x0).toFixed(1)} ${Y(y0).toFixed(1)} Z`;
  const ticks=[y0+(y1-y0)*0.1, (y0+y1)/2, y1-(y1-y0)*0.1];
  let g="";
  ticks.forEach(v=>{ g+=`<line x1="${L}" x2="${W_-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--hairline)" stroke-width="1"/>
    <text x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" fill="var(--muted)" font-size="10" text-anchor="end">${v.toFixed(1)}</text>`; });
  if(refs) refs.forEach(v=>{ if(v<y0||v>y1) return;
    g+=`<line x1="${L}" x2="${W_-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="4 4"/>
        <text x="${W_-R-2}" y="${(Y(v)-4).toFixed(1)}" fill="var(--warn)" font-size="10" text-anchor="end">${v}</text>`; });
  const fx0=X(Math.max(x0,LOG.flight_t0)), fx1=X(Math.min(x1,LOG.flight_t1));
  const block=el("div","chartblock");
  block.innerHTML = `<h4>${title} <span>${unit?`單位 ${unit} · `:""}${data.length} 點</span></h4>
   <svg viewBox="0 0 ${W_} ${H_}" preserveAspectRatio="none" role="img" aria-label="${title}">
     <rect x="${fx0.toFixed(1)}" y="${T}" width="${Math.max(1,fx1-fx0).toFixed(1)}" height="${H_-T-B}" fill="var(--warn)" fill-opacity=".08"/>
     ${g}
     <path d="${area}" fill="${color}" fill-opacity=".13"/>
     <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
     <text x="${L}" y="${H_-5}" fill="var(--muted)" font-size="10">${LOG.start_clock}</text>
     <text x="${W_-R}" y="${H_-5}" fill="var(--muted)" font-size="10" text-anchor="end">${LOG.end_clock}</text>
   </svg>`;
  body.appendChild(block);
}


let last=performance.now();
function tick(now){
  const dt=(now-last)/1000; last=now;
  if(S.playing){
    S.t += dt*S.speed;
    if(S.t>=W.len){ S.t=W.len; S.playing=false; }
    render();
  }
  requestAnimationFrame(tick);
}

/* ── 總繪製 ──────────────────────────────────────────── */
function render(){
  drawMap(); drawHud(); drawFleet(); drawFacts();
  drawSignal(); drawEvents(); drawLogCard(); renderEvModal();
  if(S.sheet) renderSheet();
}
render();
requestAnimationFrame(tick);
})();
</script>
