<title>UAV 架次回放 v2</title>
<style>
/* tokens 同 doc/design-tokens.md */
:root{
  color-scheme:dark;
  --page:#1b1a17; --surface:#262624; --surface-2:#30302c;
  --ink:#f0eee6; --ink-2:#c2bfb3; --muted:#8f8b80; --hairline:#3a3833;
  --border:rgba(240,238,230,.1);
  --accent:#d97757; --accent-bg:rgba(217,119,87,.12);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --ok:#0ca30c; --warn:#fab219; --serious:#e05e0e; --danger:#a01818; --danger-ink:#e05e5e;
  --sinr-good:#0ca30c; --sinr-fair:#fab219; --sinr-bad:#e05e0e; --sinr-crit:#a01818;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Noto Sans TC","Segoe UI",sans-serif;
  background:var(--page);color:var(--ink);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.shell{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
/* ── 頂欄：這一趟是誰、什麼時候、飛哪條 ─────────────────── */
.top{flex:none;height:46px;display:flex;align-items:center;gap:11px;padding:0 13px;
  background:var(--surface);border-bottom:1px solid var(--hairline)}
.back{padding:3px 9px;border:1px solid var(--hairline);border-radius:7px;color:var(--ink-2);font-size:12px}
.back:hover{color:var(--ink);border-color:var(--border)}
.top .who{font-size:14px;font-weight:700}
.top .meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.top .chip{font-size:11px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;
  background:var(--surface-2);font-size:11px;color:var(--ink-2);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%}
.btn{padding:4px 10px;border:1px solid var(--hairline);border-radius:7px;color:var(--ink-2);
  background:var(--surface-2);font-size:12px}
.btn:hover{color:var(--ink);border-color:var(--border)}
.btn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}

/* ⓘ */
.info{width:15px;height:15px;border-radius:50%;border:1px solid var(--hairline);
  color:var(--muted);font-size:10px;display:inline-grid;place-items:center;position:relative;
  flex:none;cursor:help;line-height:1}
.info:hover,.info:focus-visible{color:var(--ink);border-color:var(--border)}
.info::after{content:attr(data-tip);position:absolute;right:-2px;top:20px;width:262px;z-index:60;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;font-size:11px;line-height:1.65;text-align:left;font-weight:400;
  box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .12s}
.info:hover::after,.info:focus-visible::after{opacity:1;visibility:visible}

/* ── 主版面：地圖＋右側欄；時間軸與圖表在底部 ───────────── */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,26vw,368px)}
.mapwrap{position:relative;min-height:0;background:#14181c;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%}
.legend{position:absolute;left:12px;bottom:12px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:8px 11px;font-size:11.5px;
  display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.legend-row{display:flex;align-items:center;gap:9px}
.legend-lab{color:var(--muted)}
.legend-seg{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.legend-sw{width:14px;height:6px;border-radius:2px;flex:none}
.scalebar{position:absolute;right:12px;bottom:14px;font-size:11px;color:var(--ink-2)}
/* 起點時畫面上只有預計航線——**那不是壞掉，是還沒飛**，說一句比讓人猜好 */
.startnote{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:12px;color:var(--muted);background:rgba(38,38,36,.9);border:1px solid var(--border);
  border-radius:999px;padding:5px 14px;pointer-events:none}
.startnote[hidden]{display:none}
.mapmeta{position:absolute;left:12px;top:12px;display:flex;gap:7px;align-items:center}

.panel{background:var(--page);border-left:1px solid var(--hairline);padding:10px;
  display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px}
.card.grow{flex:1;min-height:150px;display:flex;flex-direction:column}
.card h3{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.h3-note{font-size:11px;color:var(--muted);font-weight:400}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px}
.fact .k{font-size:10.5px;color:var(--muted)}
.fact .v{font-size:13px;color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums}
.fact .v small{font-size:10px;color:var(--muted);margin-left:2px}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}

/* 事件流（折疊、可跳時刻） */
.evtools{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.pill{padding:2px 8px;border-radius:6px;border:1px solid transparent;color:var(--muted);font-size:11px}
.pill:hover{color:var(--ink-2)}
.pill[aria-pressed="true"]{color:var(--ink);background:var(--surface-2);border-color:var(--border)}
.evlist{flex:1;overflow-y:auto;min-height:0;margin:0 -4px;padding:0 4px}
.evrow{width:100%;display:grid;grid-template-columns:9px 44px 1fr auto;gap:8px;align-items:start;
  padding:5px 4px;border-radius:7px;text-align:left;border-bottom:1px solid rgba(58,56,51,.5)}
.evrow:hover{background:var(--surface-2)}
.evrow.now{background:var(--accent-bg)}
.evrow .dot{width:7px;height:7px;border-radius:50%;margin-top:5px}
.evrow time{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:1px}
.evrow .tx{font-size:12px;color:var(--ink-2);word-break:break-word}
.evrow .src{font-size:10px;color:var(--muted);margin-right:5px}
.count{font-size:10.5px;color:var(--ink);background:var(--surface-2);border:1px solid var(--border);
  border-radius:999px;padding:0 6px;font-variant-numeric:tabular-nums}
.density{height:9px;width:52px;display:block}
.cmdrow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:baseline;
  padding:5px 2px;border-bottom:1px solid rgba(58,56,51,.5);font-size:12px}
.cmdrow time{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cmdrow .ok{font-size:11px;color:var(--ok)}
.steps{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.step{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.hint{font-size:11px;color:var(--muted);line-height:1.7}

/* ── 底部：時間軸＋圖表（共用 X 軸）───────────────────── */
.bottom{flex:none;background:var(--surface);border-top:1px solid var(--hairline);
  padding:8px 13px 10px;display:flex;flex-direction:column;gap:7px}
.transport{display:flex;align-items:center;gap:11px}
.tbtn{width:28px;height:28px;border:1px solid var(--hairline);border-radius:8px;
  display:grid;place-items:center;color:var(--ink-2);font-size:12px;background:var(--surface-2)}
.tbtn:hover{color:var(--ink)}
.clock{font-family:var(--mono);font-size:13px;white-space:nowrap}
.clock .rel{color:var(--muted);margin-left:6px;font-size:12px}
/* 時間軸與下面兩張圖用**同一個 viewBox 與同一組左右內距**——這是「共用 X 軸」
   的實作，不是排版巧合。原本時間軸被左右的按鈕擠在中間，兩者對不起來。 */
.track{position:relative;height:34px;width:100%}
.track svg{position:absolute;inset:0;width:100%;height:100%}
.track input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.charts{display:flex;flex-direction:column;gap:2px}
.chart{position:relative}
.chart h4{font-size:11px;color:var(--muted);font-weight:400;position:absolute;left:0;top:-1px}
.chart svg{width:100%;height:74px;display:block}
details.foldcharts summary{font-size:11.5px;color:var(--muted);cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:6px}
details.foldcharts summary::-webkit-details-marker{display:none}
details.foldcharts summary::before{content:"▸";font-size:9px}
details.foldcharts[open] summary::before{content:"▾"}
details.foldcharts summary:hover{color:var(--ink-2)}

/* modal：✕ 貼齊右上、label 在它左邊 */
.mask{position:fixed;inset:0;background:rgba(12,11,9,.62);z-index:70;display:grid;place-items:center;padding:20px}
.mask[hidden]{display:none}
.modal{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:14px;
  width:min(680px,94vw);max-height:88dvh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 24px 64px rgba(0,0,0,.55);padding:14px 16px 12px;gap:8px}
.mhead{display:flex;align-items:center;gap:9px;padding-right:42px;flex:none}
.mhead .t{font-size:14.5px;font-weight:600;line-height:1.5}
.mclose{position:absolute;top:8px;right:8px;width:26px;height:26px;display:grid;place-items:center;
  border:1px solid var(--hairline);border-radius:7px;background:var(--surface);color:var(--muted);font-size:12px}
.mclose:hover{color:var(--ink);border-color:var(--border);background:var(--surface-2)}
.mmeta{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  padding-bottom:8px;border-bottom:1px solid var(--hairline)}
.mbody{overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.kv{display:grid;grid-template-columns:108px minmax(0,1fr);gap:3px 14px;font-size:12.5px;align-items:baseline}
.kv .k{color:var(--muted)}
.kv .v{font-family:var(--mono);word-break:break-all;color:var(--ink-2)}
pre.raw{background:var(--page);border:1px solid var(--hairline);border-radius:7px;padding:8px;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-2);white-space:pre-wrap;
  word-break:break-all;max-height:300px;overflow:auto}
</style>

<script>
(function(){
"use strict";
const P=window.PROTO, S=P.session, $=(s)=>document.querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};
const T0=new Date(S.start).getTime()/1000, DUR=S.dur;

/* ── 格式 ────────────────────────────────────────── */
const TZ=new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",hour12:false,
  hour:"2-digit",minute:"2-digit",second:"2-digit"});
const clock=(t)=>TZ.format(new Date((T0+t)*1000));
const rel=(t)=>`+${String(Math.floor(t/60)).padStart(2,"0")}:${String(Math.floor(t%60)).padStart(2,"0")}`;
const num=(v,d=1)=>v==null?"—":v.toFixed(d);
const dur=(s)=>s>=60?`${Math.floor(s/60)} 分 ${Math.round(s%60)} 秒`:`${Math.round(s)} 秒`;

const CLS=[{k:"good",l:"良好",c:"var(--sinr-good)",min:13},{k:"fair",l:"尚可",c:"var(--sinr-fair)",min:5},
           {k:"bad",l:"劣化",c:"var(--sinr-bad)",min:-2},{k:"crit",l:"瀕斷",c:"var(--sinr-crit)",min:-Infinity}];
const cls=(v)=>CLS.find(c=>v>=c.min)||CLS[3];
const SEV={critical:"var(--danger)",warning:"var(--warn)",info:"var(--muted)"};
const END={disarmed:"上鎖（正常結束）",telemetry_lost:"遙測中斷（不代表飛行結束）",
  telemetry_lost_backfilled:"遙測中斷，事後由機上補回"};

// **進度條預設 0**（使用者定案 2026-09-08）：回放就從這一趟的開頭開始。
// 此時地圖上只有預計航線與起飛點——實跡還沒飛出來，那是誠實的畫面，
// 不是空白；事件與指令清單照樣列全趟，目前時刻那一列會 highlight
let t=0, playing=false, speed=1, evFilter="all", openEv=null;

/* ── 3D 視角（同即時頁：傾斜、地面網格、起飛點錨定、球體機身）──── */
const V=(()=>{
  const pts=P.tele.filter(p=>p.lat!=null);
  const home=P.home ? {lat:P.home[0],lon:P.home[1]} : pts[0];
  const mLon=111320*Math.cos(home.lat*Math.PI/180), mLat=111320;
  const PIT=55*Math.PI/180, BRG=28*Math.PI/180;
  const cb=Math.cos(BRG), sb=Math.sin(BRG), cp=Math.cos(PIT), sp=Math.sin(PIT);
  const en=(lat,lon)=>[(lon-home.lon)*mLon,(lat-home.lat)*mLat];
  const proj=(e,n,u)=>{const X=e*cb+n*sb, Y=-e*sb+n*cb; return [X,-Y*cp-(u||0)*sp];};
  const all=[];
  pts.forEach(p=>{const [e,n]=en(p.lat,p.lon); all.push(proj(e,n,p.alt||0)); all.push(proj(e,n,0));});
  P.plan.forEach(w=>{const [e,n]=en(w.lat,w.lon); all.push(proj(e,n,w.alt||0)); all.push(proj(e,n,0));});
  const G=25;
  [[-G,-G],[G,-G],[-G,G],[G,G]].forEach(([e,n])=>all.push(proj(e,n,0)));
  const xs=all.map(a=>a[0]), ys=all.map(a=>a[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const pad=54, k=Math.min((1000-pad*2)/(maxX-minX),(700-pad*2)/(maxY-minY));
  const ox=(1000-(maxX-minX)*k)/2-minX*k, oy=(700-(maxY-minY)*k)/2-minY*k;
  const put=(x,y)=>[x*k+ox,y*k+oy];
  return {G,k,at:(lat,lon,u)=>{const [e,n]=en(lat,lon); const [x,y]=proj(e,n,u); return put(x,y);},
          ground:(e,n)=>{const [x,y]=proj(e,n,0); return put(x,y);}};
})();

const teleAt=(tt)=>{let r=null; for(const p of P.tele){ if(p.t<=tt) r=p; else break; } return r;};
const linkAt=(tt)=>{let r=null; for(const p of P.link){ if(p.t<=tt) r=p; else break; } return r;};

function drawMap(){
  const svg=$("#map"), ns="http://www.w3.org/2000/svg";
  svg.textContent="";
  const g=(tag,a)=>{const n=document.createElementNS(ns,tag); for(const k in a) n.setAttribute(k,a[k]); return n;};
  const defs=g("defs",{});
  defs.innerHTML=`<radialGradient id="sph" cx="34%" cy="28%" r="74%">
    <stop offset="0%" stop-color="#fff" stop-opacity=".55"/>
    <stop offset="52%" stop-color="#fff" stop-opacity=".06"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".38"/></radialGradient>`;
  svg.appendChild(defs);

  const grid=g("g",{stroke:"#232a2f","stroke-width":1});
  for(let e=-V.G;e<=V.G;e+=10){const a=V.ground(e,-V.G),b=V.ground(e,V.G);
    grid.appendChild(g("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1]}));}
  for(let n=-V.G;n<=V.G;n+=10){const a=V.ground(-V.G,n),b=V.ground(V.G,n);
    grid.appendChild(g("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1]}));}
  svg.appendChild(grid);

  // 預計航線：**灰色細帶＋地面虛線**，不與實跡的分級色混淆
  if(P.plan.length>1){
    const air=P.plan.map(w=>V.at(w.lat,w.lon,w.alt||0).map(v=>v.toFixed(1)).join(",")).join(" ");
    const gnd=P.plan.map(w=>V.at(w.lat,w.lon,0).map(v=>v.toFixed(1)).join(",")).join(" ");
    svg.appendChild(g("polyline",{points:gnd,fill:"none",stroke:"var(--muted)",
      "stroke-width":1.2,"stroke-opacity":.3,"stroke-dasharray":"5 5"}));
    svg.appendChild(g("polyline",{points:air,fill:"none",stroke:"var(--muted)",
      "stroke-width":2,"stroke-opacity":.45}));
    P.plan.forEach(w=>{const [x,y]=V.at(w.lat,w.lon,w.alt||0);
      svg.appendChild(g("circle",{cx:x,cy:y,r:3.5,fill:"none",stroke:"var(--muted)","stroke-width":1.2}));});
  }

  const pts=P.tele.filter(p=>p.t<=t && p.lat!=null);
  if(pts.length>1){
    const gnd=pts.map(p=>V.at(p.lat,p.lon,0).map(v=>v.toFixed(1)).join(",")).join(" ");
    svg.appendChild(g("polyline",{points:gnd,fill:"none",stroke:"var(--muted)",
      "stroke-width":1.6,"stroke-opacity":.3}));
  }
  const drop=g("g",{stroke:"var(--muted)","stroke-width":1,"stroke-opacity":.16});
  pts.forEach((p,i)=>{ if(i%6||!p.alt||p.alt<0.4) return;
    const a=V.at(p.lat,p.lon,p.alt), b=V.at(p.lat,p.lon,0);
    drop.appendChild(g("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1]}));});
  svg.appendChild(drop);

  // 實際路徑：逐段依**當時**的 SINR 上色，不插值不補值
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i], lk=linkAt(b.t), fresh=lk && (b.t-lk.t)<30;
    const A=V.at(a.lat,a.lon,a.alt||0), B=V.at(b.lat,b.lon,b.alt||0);
    svg.appendChild(g("line",{x1:A[0],y1:A[1],x2:B[0],y2:B[1],
      stroke:fresh?cls(lk.sinr).c:"var(--muted)","stroke-width":5,
      "stroke-linecap":"round","stroke-opacity":fresh?.95:.45}));
  }
  // 方向箭頭：每 12 個樣本一枚（回放特有，即時頁沒有）
  for(let i=6;i<pts.length;i+=12){
    const a=pts[i-1], b=pts[i];
    const A=V.at(a.lat,a.lon,a.alt||0), B=V.at(b.lat,b.lon,b.alt||0);
    const ang=Math.atan2(B[1]-A[1],B[0]-A[0]);
    const p1=[B[0],B[1]], p2=[B[0]-Math.cos(ang-0.5)*9,B[1]-Math.sin(ang-0.5)*9],
          p3=[B[0]-Math.cos(ang+0.5)*9,B[1]-Math.sin(ang+0.5)*9];
    svg.appendChild(g("path",{d:`M${p1} L${p2} L${p3}Z`,fill:"#f0eee6","fill-opacity":.75}));
  }

  const H=V.ground(0,0);
  svg.appendChild(g("ellipse",{cx:H[0],cy:H[1],rx:9,ry:9*Math.cos(55*Math.PI/180),
    fill:"none",stroke:"var(--ink-2)","stroke-width":1.5}));

  const cur=teleAt(t);
  if(cur){
    const A=V.at(cur.lat,cur.lon,cur.alt||0), Gp=V.at(cur.lat,cur.lon,0);
    const lk=linkAt(t), col=lk?cls(lk.sinr).c:"var(--muted)";
    svg.appendChild(g("line",{x1:A[0],y1:A[1],x2:Gp[0],y2:Gp[1],
      stroke:"var(--ink-2)","stroke-width":1,"stroke-opacity":.35}));
    svg.appendChild(g("circle",{cx:A[0],cy:A[1],r:11,fill:col,stroke:"rgba(0,0,0,.4)","stroke-width":1}));
    svg.appendChild(g("circle",{cx:A[0],cy:A[1],r:11,fill:"url(#sph)"}));
    const lab=g("text",{x:A[0]+15,y:A[1]-10,fill:"var(--ink)","font-size":12,"font-weight":600});
    lab.textContent=`${(cur.alt||0).toFixed(1)} m`; svg.appendChild(lab);
  }
}

/* ── 右側：這一趟 ─────────────────────────────────── */
function drawFacts(){
  const s=S.summary||{}, box=$("#facts"); box.textContent="";
  const f=(k,v,u,dot)=>{const d=el("div","fact"); d.appendChild(el("div","k",k));
    const x=el("div","v");
    if(dot) x.innerHTML=`<span class="sdot" style="background:${dot}"></span>`;
    x.appendChild(document.createTextNode(v));
    if(u){const sm=el("small",null,u); x.appendChild(sm);} d.appendChild(x); box.appendChild(d);};
  f("任務", S.mission ?? "無");
  f("時長", dur(S.dur));
  f("樣本數", String(s.samples_total ?? "—"));
  f("平均 SINR", num(s.avg_sinr), " dB", s.avg_sinr!=null?cls(s.avg_sinr).c:null);
  f("最低 SINR", num(s.min_sinr), " dB", s.min_sinr!=null?cls(s.min_sinr).c:null);
  f("平均 RTT", num(s.avg_rtt_ms,0), " ms");
  f("最高高度", num(s.max_alt_rel,0), " m");
  f("結束方式", END[S.end_reason] ?? (S.end_reason ?? "—"));
  // 遙測來源：有補傳才說（大多數架次沒這回事，不必每趟掛一句）
  const q=P.quality, qb=$("#quality"); qb.textContent="";
  if(q && q.backfilled>0){
    const w=el("div","hint");
    w.style.marginTop="8px";
    w.textContent=`遙測 ${q.live} 筆即時 · ${q.backfilled} 筆機上補傳`
      + (q.conflicts>0 ? `　⚠ ${q.conflicts} 筆落在即時資料已覆蓋的秒數上` : "");
    qb.appendChild(w);
  }
}

/* ── 事件：折疊、可跳時刻 ───────────────────────────── */
function fold(list){
  const m=new Map();
  for(const e of list){
    const k=e.type+"|"+e.text;
    if(!m.has(k)) m.set(k,{...e,times:[e.t],n:1});
    else{const g=m.get(k); g.times.push(e.t); g.n++; g.t=e.t; g.clock=e.clock;}
  }
  return [...m.values()].sort((a,b)=>a.times[0]-b.times[0]);
}
function drawEvents(){
  const tools=$("#evtools"); tools.textContent="";
  [["all","全部"],["warn","警告以上"],["vehicle","機上"],["system","系統"]].forEach(([k,l])=>{
    const b=el("button","pill",l); b.setAttribute("aria-pressed", evFilter===k?"true":"false");
    b.onclick=()=>{evFilter=k; render();}; tools.appendChild(b);
  });
  let list=P.events;
  if(evFilter==="warn") list=list.filter(e=>e.sev!=="info");
  if(evFilter==="vehicle") list=list.filter(e=>e.src==="vehicle");
  if(evFilter==="system") list=list.filter(e=>e.src!=="vehicle");
  const rows=fold(list);
  $("#evcount").textContent=`${list.length} 則`;
  const box=$("#evlist"); box.textContent="";
  if(!rows.length){ box.appendChild(el("div","hint","這組篩選沒有事件。")); return; }
  for(const g of rows){
    const near=Math.abs(g.times.reduce((a,x)=>Math.abs(x-t)<Math.abs(a-t)?x:a,g.times[0])-t)<1.5;
    const row=el("button","evrow"+(near?" now":""));
    const dot=el("span","dot"); dot.style.background=SEV[g.sev]||SEV.info; row.appendChild(dot);
    const tm=el("time",null,rel(g.times[0])); tm.title=clock(g.times[0]); row.appendChild(tm);
    const tx=el("span","tx");
    tx.appendChild(el("span","src", g.src==="vehicle"?"機上":"系統"));
    tx.appendChild(document.createTextNode(g.text.replace(/\*\*/g,"")));
    row.appendChild(tx);
    const agg=el("span");
    if(g.n>1){
      agg.appendChild(el("span","count",`×${g.n}`));
      const t0=g.times[0], t1=g.times[g.times.length-1], span=(t1-t0)||1;
      let ticks="";
      g.times.forEach(x=>{const px=((x-t0)/span*50+1).toFixed(1);
        ticks+=`<line x1="${px}" x2="${px}" y1="1" y2="8" stroke="${SEV[g.sev]||SEV.info}" stroke-width="1.4" stroke-opacity=".8"/>`;});
      agg.insertAdjacentHTML("beforeend",`<svg class="density" viewBox="0 0 52 9" preserveAspectRatio="none">${ticks}</svg>`);
    }
    row.appendChild(agg);
    // **點事件＝跳到那一刻**：判讀「那件事發生時訊號如何」不必自己對時間
    row.onclick=()=>{ t=g.times[0]; playing=false; openEv=g; render(); showEvent(g); };
    box.appendChild(row);
  }
}

function drawCmds(){
  const box=$("#cmds"); box.textContent="";
  $("#cmdcount").textContent=`${P.commands.length} 筆`;
  if(!P.commands.length){ box.appendChild(el("div","hint","這一趟沒有從地面站下過指令。")); return; }
  for(const c of P.commands){
    const r=el("div","cmdrow");
    const tm=el("time",null,rel(c.t)); tm.title=clock(c.t); r.appendChild(tm);
    const mid=el("div");
    mid.appendChild(el("div",null,c.action));
    const st=el("div","steps");
    c.steps.forEach(s=>{const b=el("span","step",
      `${s.k}：${s.ok?"接受":"未接受"}${s.ms!=null?` ${s.ms.toFixed(0)}ms`:""}`); st.appendChild(b);});
    mid.appendChild(st);
    r.appendChild(mid);
    r.appendChild(el("span","ok", c.result==="accepted"?"已執行":c.result));
    r.onclick=()=>{ t=c.t; playing=false; render(); showCmd(c); };
    r.style.cursor="pointer";
    box.appendChild(r);
  }
}

/* ── 底部：時間軸（事件釘點＋模式帶）＋兩張圖共用 X 軸 ───── */
const PAD_L=44, PAD_R=10;
const X=(tt)=>PAD_L+(tt/DUR)*(1000-PAD_L-PAD_R);

function drawTrack(){
  const MC={AUTO:"var(--series-3)",GUIDED:"var(--series-1)",LAND:"var(--series-2)",LOITER:"var(--surface-2)"};
  let s="";
  const segs=P.modes.map((m,i)=>({...m,end:i+1<P.modes.length?P.modes[i+1].t:DUR}));
  segs.forEach(m=>{
    s+=`<rect x="${X(m.t).toFixed(1)}" y="20" width="${(X(m.end)-X(m.t)).toFixed(1)}" height="8"
        fill="${MC[m.mode]||"var(--surface-2)"}" fill-opacity=".5"/>`;
    if(X(m.end)-X(m.t)>46)
      s+=`<text x="${(X(m.t)+4).toFixed(1)}" y="27" fill="var(--muted)" font-size="8">${m.mode}</text>`;
  });
  s+=`<rect x="${PAD_L}" y="12" width="${1000-PAD_L-PAD_R}" height="4" fill="var(--hairline)"/>`;
  s+=`<rect x="${PAD_L}" y="12" width="${(X(t)-PAD_L).toFixed(1)}" height="4" fill="var(--accent)" fill-opacity=".65"/>`;
  P.events.forEach(e=>{
    const c=SEV[e.sev]||SEV.info;
    s+=`<line x1="${X(e.t).toFixed(1)}" x2="${X(e.t).toFixed(1)}" y1="4" y2="11" stroke="${c}" stroke-width="1.4"/>`;
  });
  P.commands.forEach(c=>{
    s+=`<path d="M${X(c.t).toFixed(1)} 2 l4 6 l-8 0 Z" fill="var(--accent)"/>`;
  });
  s+=`<line x1="${X(t).toFixed(1)}" x2="${X(t).toFixed(1)}" y1="0" y2="30" stroke="var(--accent)" stroke-width="2"/>`;
  $("#tracksvg").innerHTML=s;
  $("#range").value=String((t/DUR)*100);
  $("#clkAbs").textContent=clock(t);
  $("#clkRel").textContent=rel(t);
  $("#play").textContent=playing?"❚❚":"▶";
  $("#spd").textContent=speed+"×";
}

/** 兩張圖共用 X 軸、上下堆疊。**SINR 線用中性墨色不分段變色**——地圖軌跡
 *  已經載了分級色，圖上重複是噪音（doc/frontend.md 回放頁定案）。 */
function chart(key, label, unit, refs){
  const pts=P.link.filter(r=>r[key]!=null).map(r=>[r.t,r[key]]);
  if(pts.length<2) return "";
  const H=74, T=12, B=14;
  const ys=pts.map(p=>p[1]);
  let y0=Math.min(...ys), y1=Math.max(...ys);
  if(refs) refs.forEach(v=>{y0=Math.min(y0,v); y1=Math.max(y1,v);});
  const pad=(y1-y0)*0.15||1; y0-=pad; y1+=pad;
  const Y=(v)=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" ");
  let g="";
  [y0+(y1-y0)*0.15,(y0+y1)/2,y1-(y1-y0)*0.15].forEach(v=>{
    g+=`<line x1="${PAD_L}" x2="${1000-PAD_R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"
        stroke="var(--hairline)" stroke-width="1"/>
        <text x="${PAD_L-6}" y="${(Y(v)+3.5).toFixed(1)}" fill="var(--muted)" font-size="9" text-anchor="end">${v.toFixed(0)}</text>`;
  });
  // 門檻帶：SINR 才有（5／13 dB＝backend 事件門檻），RTT 沒有權威門檻就不畫
  if(refs) refs.forEach(v=>{
    g+=`<line x1="${PAD_L}" x2="${1000-PAD_R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"
        stroke="var(--warn)" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".55"/>`;
  });
  const cur=P.link.filter(r=>r.t<=t && r[key]!=null).slice(-1)[0];
  const dot=cur?`<circle cx="${X(cur.t).toFixed(1)}" cy="${Y(cur[key]).toFixed(1)}" r="3" fill="var(--ink)"/>`:"";
  return `<div class="chart"><h4>${label}${unit?` · ${unit}`:""}</h4>
    <svg viewBox="0 0 1000 ${H}" preserveAspectRatio="none">
      ${g}<path d="${d}" fill="none" stroke="var(--ink-2)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
      <line x1="${X(t).toFixed(1)}" x2="${X(t).toFixed(1)}" y1="0" y2="${H-B}" stroke="var(--accent)" stroke-width="1.5"/>
      ${dot}</svg></div>`;
}
function drawCharts(){
  $("#charts").innerHTML = chart("sinr","SINR","dB",[5,13]) + chart("rtt","RTT","ms",null);
}

/* ── modal ───────────────────────────────────────── */
const mask=$("#mask");
function openModal(title, chip, meta, body){
  $("#mTitle").textContent=title;
  const c=$("#mChip"); c.textContent=chip||""; c.hidden=!chip;
  $("#mMeta").textContent=meta;
  const b=$("#mBody"); b.textContent=""; b.appendChild(body);
  mask.hidden=false;
}
$("#mClose").onclick=()=>{mask.hidden=true;};
mask.onclick=(e)=>{ if(e.target===mask) mask.hidden=true; };
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") mask.hidden=true; });

function showEvent(g){
  const body=el("div");
  const kv=el("div","kv");
  const put=(k,v)=>{kv.appendChild(el("span","k",k)); kv.appendChild(el("span","v",v));};
  put("型別", `${g.type}（${g.src==="vehicle"?"機上訊息":"系統推導"}）`);
  put("嚴重度", g.sev);
  put(g.n>1?"首次":"時刻", clock(g.times[0]));
  if(g.n>1) put("最近", clock(g.times[g.times.length-1]));
  Object.entries(g.detail||{}).forEach(([k,v])=>{
    if(k==="text"||k==="count") return;
    put(k, typeof v==="object"?JSON.stringify(v):String(v));
  });
  body.appendChild(kv);
  if(g.n>1){
    const p=el("pre","raw", g.times.map(x=>`${clock(x)}  ${rel(x)}`).join("\n"));
    body.appendChild(el("div","hint",`逐則（${g.n} 次）`)); body.appendChild(p);
  }
  openModal(g.text.replace(/\*\*/g,""), g.sev==="critical"?"危急":g.sev==="warning"?"警告":"資訊",
    `${clock(g.times[0])} · ${rel(g.times[0])}`, body);
}
function showCmd(c){
  const body=el("div");
  const st=el("div","steps");
  c.steps.forEach(s=>st.appendChild(el("span","step",
    `${s.k}：${s.ok?"接受":"未接受"}${s.ms!=null?` ${s.ms.toFixed(0)}ms`:""}`)));
  body.appendChild(st);
  body.appendChild(el("div","hint","下令者：" + (c.client||"—")));
  body.appendChild(el("pre","raw", c.raw));
  openModal(`指令 · ${c.action}`, c.result==="accepted"?"已執行":c.result,
    `${clock(c.t)} · ${rel(c.t)}`, body);
}

/* ── 傳輸控制 ────────────────────────────────────── */
$("#play").onclick=()=>{ playing=!playing; if(playing && t>=DUR) t=0; render(); };
$("#spd").onclick=()=>{ speed = speed===1?2:speed===2?4:1; render(); };
$("#range").oninput=(e)=>{ t=(parseFloat(e.target.value)/100)*DUR; playing=false; render(); };
let last=performance.now();
function tick(now){
  const dt=(now-last)/1000; last=now;
  if(playing){ t+=dt*speed; if(t>=DUR){t=DUR; playing=false;} render(); }
  requestAnimationFrame(tick);
}

function render(){
  drawMap(); drawFacts(); drawEvents(); drawCmds(); drawTrack(); drawCharts();
  const cur=teleAt(t), lk=linkAt(t);
  $("#startnote").hidden = !!cur;
  $("#modechip").textContent = cur?cur.mode:"—";
  $("#altchip").textContent = cur? `▲ ${(cur.alt||0).toFixed(1)} m` : "▲ —";
  const c=$("#sigchip");
  c.textContent = lk? `${lk.sinr.toFixed(1)} dB SINR` : "無量測";
  c.innerHTML = lk
    ? `<span class="dot" style="background:${cls(lk.sinr).c}"></span>${lk.sinr.toFixed(1)} dB · ${cls(lk.sinr).l}`
    : "此刻沒有鏈路量測";
}

$("#who").textContent=S.drone;
$("#topmeta").textContent=`${S.start_clock}–${S.end_clock} · ${dur(S.dur)} · ${S.mission ?? "無任務"}`;
$("#endchip").textContent=END[S.end_reason] ?? (S.end_reason ?? "—");
render();
requestAnimationFrame(tick);
})();
</script>
