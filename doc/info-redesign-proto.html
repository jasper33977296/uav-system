<title>UAV 資訊 v2</title>
<style>
/* tokens 同 doc/design-tokens.md（深色為預設與設計基準） */
:root{
  color-scheme:dark;
  --page:#1b1a17; --surface:#262624; --surface-2:#30302c;
  --ink:#f0eee6; --ink-2:#c2bfb3; --muted:#8f8b80; --hairline:#3a3833;
  --border:rgba(240,238,230,.1);
  --accent:#d97757; --accent-bg:rgba(217,119,87,.12);
  --series-1:#3987e5;
  --ok:#0ca30c; --warn:#fab219; --serious:#e05e0e; --danger:#a01818;
  --danger-ink:#e05e5e; --rec:#d03b3b;
  --sinr-good:#0ca30c; --sinr-fair:#fab219; --sinr-bad:#e05e0e; --sinr-crit:#a01818;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Noto Sans TC","Segoe UI",sans-serif;
  background:var(--page);color:var(--ink);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.spacer{flex:1}

/* ── shell ─────────────────────────────────────────── */
.shell{min-height:100dvh;display:flex;flex-direction:column}
.nav{flex:none;height:46px;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--surface);border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:20}
.brand{font-size:13px;font-weight:700;letter-spacing:.02em}
.navtabs{display:flex;gap:2px}
.navtabs button{padding:5px 9px;border-radius:6px;color:var(--muted);display:grid;place-items:center}
.navtabs button[aria-current="true"]{color:var(--accent);background:var(--accent-bg)}
.navtabs button:hover{color:var(--ink)}
.reclight{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.recdot{width:11px;height:11px;border-radius:50%;background:var(--muted)}
.page{padding:14px;display:flex;flex-direction:column;gap:9px;max-width:1500px;width:100%}

/* ⓘ：解釋只住這裡 */
.info{width:15px;height:15px;border-radius:50%;border:1px solid var(--hairline);
  color:var(--muted);font-size:10px;display:inline-grid;place-items:center;position:relative;
  flex:none;cursor:help;line-height:1}
.info:hover,.info:focus-visible{color:var(--ink);border-color:var(--border)}
.info::after{content:attr(data-tip);position:absolute;right:-2px;top:20px;width:260px;z-index:40;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;font-size:11px;line-height:1.65;text-align:left;font-weight:400;
  box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .12s}
.info:hover::after,.info:focus-visible::after{opacity:1;visibility:visible}

/* ── 頁首 ──────────────────────────────────────────── */
.head{display:flex;align-items:center;gap:9px;padding:2px 2px 0}
.head h1{font-size:15px;font-weight:700}
.head .sub{font-size:12px;color:var(--muted)}
.notice{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;
  background:rgba(250,178,25,.09);border:1px solid rgba(250,178,25,.3);
  font-size:11.5px;color:var(--ink-2)}
.notice b{color:var(--warn);font-weight:600}

/* ── 機列 ──────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left;
  border-radius:12px}
.row:hover{background:var(--surface-2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.off{background:none;border:1.5px solid var(--muted)}
.nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{font-size:12.5px;white-space:nowrap;letter-spacing:.01em}
/* 飛行中用亮一階的紅（#d03b3b 在暖炭黑上偏糊）；模式另外一格，不併進狀態句 */
.state.flying{color:#e05e5e;font-weight:700}
.mode{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
  background:var(--surface-2);border-radius:5px;padding:1px 7px;white-space:nowrap}
.state.on{color:var(--ok)}
.state.off{color:var(--muted)}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.bars i{width:3px;border-radius:1px;display:block}
.sig-n{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.batt{width:24px;height:11px;border:1.5px solid var(--ink-2);border-radius:3px;padding:1px;position:relative}
.batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:3px;background:var(--ink-2)}
.batt i{display:block;height:100%;border-radius:1px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;
  background:var(--surface-2);font-size:11px;color:var(--ink-2);white-space:nowrap}
.chip.warn{background:rgba(250,178,25,.12);color:var(--warn);border:1px solid rgba(250,178,25,.3)}
.chip.dan{background:rgba(160,24,24,.16);color:#f0a5a5;border:1px solid rgba(224,94,94,.35)}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.caret{color:var(--muted);font-size:11px;width:12px;text-align:center}
.sub{display:flex;flex-wrap:wrap;gap:3px 12px;padding:0 12px 9px 31px;
  font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── 展開工作區 ────────────────────────────────────── */
.work{border-top:1px solid var(--hairline);padding:11px 12px 12px;
  display:flex;flex-direction:column;gap:11px}
.sect{display:flex;flex-direction:column;gap:7px}
.sect h3{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px}
.box{background:var(--page);border:1px solid var(--hairline);border-radius:10px;padding:9px 11px;
  display:flex;flex-direction:column;gap:6px}
.box .cap{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kv{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;font-size:12px}
.kv .k{color:var(--muted);font-size:11px}
.kv .v{color:var(--ink);font-family:var(--mono);word-break:break-all}
.kv .v.empty{color:var(--muted);font-family:inherit}
.mini{font-size:11px;color:var(--muted);border:1px solid var(--hairline);border-radius:6px;
  padding:1px 7px}
.mini:hover{color:var(--ink);border-color:var(--border)}
.btn{padding:4px 11px;border:1px solid var(--hairline);border-radius:7px;color:var(--ink-2);
  background:var(--surface-2);font-size:12px}
.btn:hover{color:var(--ink);border-color:var(--border)}
.btn.danger{color:var(--danger-ink);border-color:rgba(224,94,94,.4);background:transparent}
.btn.danger:hover{background:rgba(208,59,59,.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

/* 架次表 */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;
  padding:0 8px 6px;border-bottom:1px solid var(--hairline);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid rgba(58,56,51,.55);color:var(--ink-2);white-space:nowrap}
td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
tr.tap{cursor:pointer}
tr.tap:hover td{background:var(--surface-2)}
.sdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.evc{font-size:11px;color:var(--muted)}
.evc b{color:#f0a5a5;font-weight:600}
.rowacts{display:flex;gap:6px;justify-content:flex-end}
.empty{color:var(--muted);font-size:12px;padding:10px 2px}
.hint{font-size:11px;color:var(--muted);line-height:1.7}

/* ── 小隊 ──────────────────────────────────────────── */
.grp{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.grp-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.grp-name{font-size:13.5px;font-weight:700}
.grp-meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.grp-members{display:flex;gap:6px;flex-wrap:wrap}
.member{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:8px;
  background:var(--page);border:1px solid var(--hairline);font-size:12px;color:var(--ink-2)}
.member .dot{width:7px;height:7px}
.grp-empty{font-size:12px;color:var(--muted)}
.pickrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;
  border:1px solid var(--hairline);background:var(--page);cursor:pointer;width:100%;text-align:left}
.pickrow:hover{background:var(--surface-2)}
.pickrow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg)}
.pickbox{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--muted);
  display:grid;place-items:center;font-size:10px;color:var(--accent);flex:none}
/* 小隊 chip 用中性色：**accent 只准互動 chrome**（design-tokens 鐵則），
   而這是一個標籤不是按鈕 */
.chip.grp{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--hairline)}

/* ── modal（全站同形：✕ 固定右上、label 靠左邊）──────── */
.mask{position:fixed;inset:0;background:rgba(12,11,9,.62);z-index:60;display:grid;place-items:center;padding:20px}
.mask[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  width:min(560px,94vw);max-height:88dvh;display:flex;flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,.55);overflow:hidden}
.mhead{display:flex;align-items:center;gap:9px;padding:13px 15px 10px;flex:none}
.mhead .t{font-size:14.5px;font-weight:600}
.mhead .meta{font-size:11.5px;color:var(--muted)}
.mbody{padding:0 15px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:10px 15px 13px;
  border-top:1px solid var(--hairline)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
label.field input{background:var(--page);border:1px solid var(--hairline);border-radius:7px;
  padding:6px 9px;font-size:13px;color:var(--ink)}
</style>
<style>
.pills{display:inline-flex;gap:3px}
.pill{padding:2px 9px;border-radius:6px;border:1px solid transparent;color:var(--muted);font-size:11.5px}
.pill:hover{color:var(--ink-2)}
.pill[aria-pressed="true"]{color:var(--ink);background:var(--surface-2);border-color:var(--border)}
.tabs{display:flex;gap:3px;padding:6px 0 0;border-bottom:1px solid var(--hairline)}
.tabs button{padding:6px 13px;font-size:12.5px;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.split{display:grid;grid-template-columns:262px minmax(0,1fr);gap:9px;align-items:start}
.list{max-height:calc(100dvh - 190px);overflow-y:auto}
.daygrp{padding:9px 11px 3px;font-size:11px;color:var(--muted);letter-spacing:.04em}
.frow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 11px;
  font-size:12.5px;color:var(--ink-2);white-space:nowrap;min-width:0}
.frow:hover{background:var(--surface-2);color:var(--ink)}
.frow[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);
  box-shadow:inset 2px 0 0 var(--accent)}
.ftime{font-variant-numeric:tabular-nums;font-weight:600}
.fdur{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.fdrone{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;min-width:0;flex:1}
.badge{min-width:17px;height:17px;padding:0 4px;border-radius:9px;font-size:10.5px;
  display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.badge.warn{background:rgba(250,178,25,.16);color:var(--warn)}
.badge.crit{background:rgba(208,59,59,.18);color:#f0a5a5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px 14px;
  padding:2px 0 4px}
.kpi{display:flex;flex-direction:column;gap:1px}
.kpi .k{font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.kpi .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .v.s{font-size:13px;font-weight:600}
.kpi .v.dim{color:var(--muted);font-weight:500}
.sect{border-top:1px solid var(--hairline);padding:10px 0 2px;margin-top:9px}
.secthead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.secthead h4{font-size:12px;font-weight:600;color:var(--ink-2)}
.crow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:5px 6px;
  border-radius:7px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.crow:hover{background:var(--surface-2);color:var(--ink)}
.ct{color:var(--muted);font-size:11.5px}
.cact{color:var(--ink);font-weight:600}
.pilltiny{font-size:10.5px;padding:1px 7px;border-radius:999px;white-space:nowrap}
.pilltiny.ok{background:rgba(12,163,12,.14);color:#5fce5f}
.pilltiny.no{background:rgba(208,59,59,.16);color:#f0a5a5}
.erow{display:flex;align-items:center;gap:9px;padding:4px 6px;border-radius:7px;font-size:12.5px}
.erow:hover{background:var(--surface-2)}
.edot{width:7px;height:7px;border-radius:50%;flex:none}
.etxt{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dens{display:inline-flex;align-items:flex-end;gap:1px;height:11px}
.dens i{width:2px;background:var(--hairline);display:block}
.band{display:flex;flex-direction:column;gap:5px;padding-top:4px}
.bandrow{display:flex;align-items:center;gap:9px}
.bandlab{width:64px;font-size:11px;color:var(--muted);text-align:right;flex:none}
.bar{flex:1;height:13px;border-radius:4px;background:var(--page);overflow:hidden;
  display:flex;position:relative}
.bar i{display:block;height:100%;top:0}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);
  padding-left:73px;font-variant-numeric:tabular-nums}
.filters{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 11px}
.search{background:var(--page);border:1px solid var(--hairline);border-radius:8px;
  padding:3px 9px;font-size:12px;color:var(--ink);width:180px}
.big3{display:flex;gap:20px;align-items:baseline;padding:2px 0}
.big3 .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.big3 .l{font-size:11px;color:var(--muted);margin-left:4px}
.agentrow{display:flex;align-items:center;gap:10px;padding:6px 2px;font-size:12.5px;
  border-bottom:1px solid rgba(58,56,51,.5)}
.agentrow:last-child{border-bottom:none}
pre.raw{background:var(--page);border:1px solid var(--hairline);border-radius:8px;
  padding:9px 11px;font-family:var(--mono);font-size:11px;color:var(--ink-2);
  white-space:pre-wrap;word-break:break-all;max-height:46dvh;overflow:auto}
</style>
<div class="shell">
  <nav class="nav">
    <span class="brand">UAV 監控</span>
    <div class="navtabs">
      <button title="即時監控"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/></svg></button>
      <button title="無人機"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5.5" cy="5.5" r="2.4"/><circle cx="18.5" cy="5.5" r="2.4"/><circle cx="5.5" cy="18.5" r="2.4"/><circle cx="18.5" cy="18.5" r="2.4"/><rect x="10" y="10" width="4" height="4" rx="1.4"/></svg></button>
      <button title="路徑管理"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19c6 0 2-10 8-10 5 0 3 7 8 5"/></svg></button>
      <button title="比較"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 16l5-6 4 3 6-8"/><path d="M3 20l5-4 4 2 6-6" opacity=".5"/></svg></button>
      <button aria-current="true" title="資訊"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7.5l9-4.5 9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></svg></button>
    </div>
    <span class="spacer"></span>
    <span class="reclight" id="reclight"><span class="recdot"></span>未記錄</span>
  </nav>

  
  <div class="page">
    <div class="head">
      <h1>資訊</h1>
      <span class="spacer"></span>
      <span class="info" tabindex="0" data-tip="這套系統記得的每一趟飛行、每一則事件、每一個檔案都在這裡。架次＝那一趟發生了什麼；事件＝那件事什麼時候開始的；錄製與回傳＝那些資料我拿不拿得到。分頁會進網址，重整不會跳回第一頁，也貼得出連結。">ⓘ</span>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tF" aria-selected="true">架次</button>
      <button role="tab" id="tE" aria-selected="false">事件</button>
      <button role="tab" id="tC" aria-selected="false">錄製與回傳</button>
    </div>
    <section id="secF"></section>
    <section id="secE" hidden></section>
    <section id="secC" hidden></section>
  </div>
</div>

  <div class="mask" id="mask" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="mhead">
        <span class="t" id="mtitle"></span>
        <span class="meta" id="mmeta"></span>
        <span class="spacer"></span>
        <button class="mini" id="mclose" aria-label="關閉">✕</button>
      </div>
      <div class="mbody" id="mbody"></div>

const day=(iso)=>dt(iso).toLocaleDateString("zh-TW",{...TZ,month:"2-digit",day:"2-digit",weekday:"short"});
const dur=(a,b)=>{ if(!b) return "—"; const s=Math.round((dt(b)-dt(a))/1000);
  return s>=3600?`${Math.floor(s/3600)} 時 ${Math.floor(s%3600/60)} 分`
       : s>=60?`${Math.floor(s/60)} 分 ${s%60} 秒` : `${s} 秒`; };
const f1=(v)=>v==null?"—":(+v).toFixed(1);

/** 一則事件講成一句話。**同一件事只講一次**：ack、模式、任務進度在舊版是
 *  三列，這裡各自只留自己那一句，而「值不值得看」由 rank 決定。 */
function evText(e){
  const d=dj(e.detail);
  if(d.text) return String(d.text).replace(/\*\*/g,"");
  switch(e.type){
    case "mode_change": return `模式 ${d.from??"—"} → ${d.to??"—"}`;
    case "waypoint_reached": return `到達第 ${d.seq} 個航點（共 ${d.total}）`;
    case "mission_state": return `任務狀態 ${d.from??"不明"} → ${d.to}`;
    case "mission_progress": return `任務進度 第 ${d.from??0} → 第 ${d.to} 項（共 ${d.total}）`;
    case "sysid_claimed": return `sysid ${d.sysid} 由「${d.drone}」認領（${d.how}）`;
    case "failsafe": return `失效保護：${d.state}`;
    default: return e.type;
  }
}
/** 值不值得先看。**這不是過濾掉，是排序與預設**——「全部」永遠按得到。 */
function rank(e){
  const s=e.severity==="warn"?"warning":e.severity;
  if(s==="critical") return 3;
  if(s==="warning") return 2;
  if(["mode_change","mission_state","failsafe","rc_link"].includes(e.type)) return 1;
  return 0;
}
/** 結束方式的人話。**認不得的原樣顯示**，不寫「未知」——那會讓「沒有紀錄」
 *  與「我沒收錄這個代碼」看起來一樣。 */
const END={disarmed:"上鎖（正常結束）", timeout:"逾時（沒有再收到遙測）",
  landed:"降落", manual:"人工結束", crash:"墜機"};
const sessDrones=[...new Set(P.sessions.map(s=>s.drone_name))];
/** 事件本身只帶 drone_id——名字在機隊表裡。**join 在畫面做**，後端回一份
 *  名字快照的話，改名之後歷史事件就會掛著舊名字。 */
const DNAME=Object.fromEntries(P.drones.map(d=>[d.id,d.name]));
const dname=(e)=>e.drone_name||DNAME[e.drone_id]||"";

/* ── 架次分頁 ───────────────────────────────────────── */
const F={sel:P.sessions[0]?.id, drone:"all", test:false, all:false};

function sessList(){
  return P.sessions.filter(s=>(F.drone==="all"||s.drone_name===F.drone)
    && (F.test||s.origin!=="test"));
}

function drawFlights(){
  const box=$("#secF"); box.textContent="";
  const wrap=el("div","split");

  // 左：清單。**日期做群組標頭**，列上不再逐列重複年月日
  const left=el("div","card list");
  const head=el("div","filters");
  head.appendChild(el("span","lab","無人機"));
  const ds=el("select");
  [["all","全部"],...sessDrones.map(n=>[n,n])].forEach(([v,l])=>{
    const o=el("option",null,l); o.value=v; ds.appendChild(o);});
  ds.value=F.drone; ds.onchange=()=>{F.drone=ds.value; drawFlights();};
  head.appendChild(ds);
  const tb=el("button","pill","含測試");
  tb.setAttribute("aria-pressed",F.test?"true":"false");
  tb.onclick=()=>{F.test=!F.test; drawFlights();};
  head.appendChild(tb);
  left.appendChild(head);
  let lastDay=null;
  sessList().forEach(s=>{
    const d=day(s.started_at);
    if(d!==lastDay){ lastDay=d; left.appendChild(el("div","daygrp",d)); }
    const b=el("button","frow");
    b.setAttribute("aria-pressed", F.sel===s.id?"true":"false");
    b.appendChild(el("span","ftime",hm(s.started_at)));
    b.appendChild(el("span","fdur",dur(s.started_at,s.ended_at)));
    // 機名只在「全部」時出現——已經篩成一台了還逐列重複，是雜訊不是資訊
    if(F.drone==="all") b.appendChild(el("span","fdrone",s.drone_name));
    b.appendChild(el("span","spacer"));
    if(s.events_critical) b.appendChild(el("span","badge crit",String(s.events_critical)));
    else if(s.events_warning) b.appendChild(el("span","badge warn",String(s.events_warning)));
    b.onclick=()=>{F.sel=s.id; drawFlights();};
    left.appendChild(b);
  });
  wrap.appendChild(left);
  wrap.appendChild(detail());
  box.appendChild(wrap);
}

  ch.appendChild(t1);

  P.detail.commands.forEach(c=>{
    const d=dj(c.detail);

    const b=el("button","crow");

  c2h.appendChild(t3);

/** 兩層錄製的覆蓋帶。**架次分頁與錄製分頁共用這一份**——兩份實作會在
 *  某一次修改之後開始各說各話。 */
function coverage(cov){
  const wrap=document.createDocumentFragment();
  const band=el("div","band");
  const t0s=cov.from, t1s=cov.to, span=Math.max(1,t1s-t0s);
  const pct=(t)=>((t-t0s)/span)*100;
  const GAP="repeating-linear-gradient(45deg,rgba(143,139,128,.45) 0 5px,"
    +"rgba(143,139,128,.12) 5px 10px)";
  /** 一條時間帶。**沒有涵蓋到的畫斜線，不留白**——留白會被讀成
   *  「這裡什麼都沒發生」，而事實是「這一段沒有錄到」。 */
  const track=(lab,segs,fill,empty)=>{
    const row=el("div","bandrow");
    row.appendChild(el("span","bandlab",lab));
    const bar=el("div","bar");
    if(empty){ bar.style.background=GAP; bar.title=empty;
      const t=el("span","ct",empty); t.style.cssText="padding-left:8px;line-height:13px";
      bar.appendChild(t); }
    else {
      bar.style.background=GAP;
      segs.forEach(([f,t])=>{ const i=el("i");
        i.style.cssText=`position:absolute;left:${pct(f)}%;width:${Math.max(.5,pct(t)-pct(f))}%;`
          +`background:${fill}`;
        bar.appendChild(i); });
      bar.style.position="relative";
    }
    row.appendChild(bar);
    band.appendChild(row);
  };
  // 上排＝機上錄的（每一份錄製檔自己涵蓋的那一段）
  track("機上錄製",
    (cov.onboard||[]).filter(o=>o.covers).map(o=>[o.covers.from,o.covers.to]),
    "#0ca30c", cov.onboard_known?null:"沒有機上錄製涵蓋這一趟");
  // 下排＝地面站錄的：整段都有，扣掉失明的那幾段
  const bl=cov.blackouts||[];
  const gs=[]; let cur=t0s;
  bl.slice().sort((x,y)=>x.from-y.from).forEach(g=>{
    if(g.to<=cur) return;
    if(g.from>cur) gs.push([cur,g.from]);
    cur=Math.max(cur,g.to);
  });
  if(cur<t1s) gs.push([cur,t1s]);
  track("地面站錄製", gs, "#fab219", null);
  wrap.appendChild(band);
  const ax=el("div","axis");
  [0,.5,1].forEach(f=>ax.appendChild(el("span",null,
    new Date((t0s+f*span)*1000).toLocaleTimeString("zh-TW",
      {...TZ,hour:"2-digit",minute:"2-digit",hour12:false}))));
  wrap.appendChild(ax);
  const un=bl.filter(g=>g.covered_onboard===false);
  const fill2=bl.filter(g=>g.covered_onboard===true);
  const secs=(a2)=>a2.reduce((n,g)=>n+g.seconds,0);
  const durS=(x)=>x>=60?`${Math.floor(x/60)} 分 ${Math.round(x%60)} 秒`:`${Math.round(x)} 秒`;
  wrap.appendChild(el("div","hint", !bl.length
    ? "地面站全程都有收到——兩層錄到的是同一段。"
    : [fill2.length?`地面站漏了 ${fill2.length} 段（${durS(secs(fill2))}），機上那份有`:null,
       un.length?`兩層都沒有 ${un.length} 段（${durS(secs(un))}）`:null]
      .filter(Boolean).join("・")));
  return wrap;
}

function cmdName(a){
  const m={"takeoff":"起飛","mode":"切換模式","mission_fly":"開始任務","rtl":"返航","land":"降落"};
  const [k,arg]=String(a).split(":");
  return m[k] ? (arg?`${m[k]}（${arg}）`:m[k]) : a;
}

/* ── 事件分頁 ───────────────────────────────────────── */
const E={sev:"all", src:"all", drone:"all", q:""};
function drawEvents(){
  const box=$("#secE"); box.textContent="";
  const f=el("div","card filters");
  const seg=(lab,cur,opts,set)=>{
    f.appendChild(el("span","lab",lab));
    const p=el("span","pills");
    opts.forEach(([v,l])=>{ const b=el("button","pill",l);
      b.setAttribute("aria-pressed",cur===v?"true":"false");
      b.onclick=()=>{set(v); drawEvents();}; p.appendChild(b); });
    f.appendChild(p);
  };
  seg("嚴重度",E.sev,[["all","全部"],["critical","危急"],["warning","警告"],["info","資訊"]],
      v=>E.sev=v);
  seg("來源",E.src,[["all","全部"],["vehicle","機上"],["system","系統"]], v=>E.src=v);
  const ds=el("select");
  [["all","機：全部"],...[...new Set(P.events.map(dname).filter(Boolean))]
    .map(n=>[n,n])].forEach(([v,l])=>{const o=el("option",null,l);o.value=v;ds.appendChild(o);});
  ds.value=E.drone; ds.onchange=()=>{E.drone=ds.value; drawEvents();};
  f.appendChild(ds);
  const q=el("input","search"); q.placeholder="搜尋內容"; q.value=E.q;
  q.oninput=()=>{E.q=q.value; drawEvents();};
  f.appendChild(q);
  box.appendChild(f);

  const VEH=new Set(["statustext","vehicle_ack","mode_change","waypoint_reached",
                     "mission_state","mission_progress"]);
  const rows=P.events.filter(e=>{
    const s=e.severity==="warn"?"warning":e.severity;
    if(E.sev!=="all" && s!==E.sev) return false;
    if(E.src!=="all" && (VEH.has(e.type)?"vehicle":"system")!==E.src) return false;
    if(E.drone!=="all" && dname(e)!==E.drone) return false;
    if(E.q && !evText(e).toLowerCase().includes(E.q.toLowerCase())) return false;
    return true;
  });

  const c=el("div","card"); c.style.padding="4px 11px 9px";
  const hh=el("div","secthead"); hh.style.padding="8px 0 2px";
  hh.appendChild(el("h4",null,"事件"));
  hh.appendChild(el("span","lab",
    `${rows.length} 則${P.events.length>=200?"（載入上限，還有更早的）":""}`));
  hh.appendChild(el("span","spacer"));
  const ti=el("span","info","ⓘ"); ti.tabIndex=0;
  ti.dataset.tip="跨架次的事件流，新的在上。同一句重複出現的會折成一列並標 ×N，右邊的小條是它們在時間上的分布——連續出現與偶爾出現是兩件事。日期做群組標頭、機名只在「機：全部」時出現：那些欄位逐列重複的話，真正的內容會被擠到右邊。";
  hh.appendChild(ti);
  c.appendChild(hh);

  // 折疊：同一句只留一列，帶 ×N 與時間分布
  const groups=new Map();
  rows.forEach(e=>{
    const key=`${e.type}|${evText(e)}|${dname(e)}`;
    const g=groups.get(key)||{e,times:[],n:0};
    g.times.push(dt(e.time).getTime());
    g.n+=(dj(e.detail).count||1);
    if(e.time>g.e.time) g.e=e;
    groups.set(key,g);
  });
  const list=[...groups.values()].sort((a,b)=>a.e.time<b.e.time?1:-1);
  let lastDay=null;
  list.forEach(g=>{
    const d=day(g.e.time);
    if(d!==lastDay){ lastDay=d; c.appendChild(el("div","daygrp",d)); }
    const r=el("div","erow");
    const dot=el("span","edot"); dot.style.background=sev(g.e.severity).c;
    r.appendChild(dot);
    r.appendChild(el("span","ct",hms(g.e.time)));
    if(E.drone==="all") r.appendChild(el("span","ct",dname(g.e)));
    r.appendChild(el("span","etxt",evText(g.e)));
    r.appendChild(el("span","spacer"));
    if(g.n>1) r.appendChild(el("span","ex",`×${g.n}`));
    if(g.times.length>1) r.appendChild(dens(g.times, sev(g.e.severity).c));
    c.appendChild(r);
  });
  box.appendChild(c);
}
function dens(times,color){
  const wrap=el("span","dens");
  const t0=Math.min(...times), t1=Math.max(...times), N=18;
  const bins=new Array(N).fill(0);
  times.forEach(t=>{ bins[Math.min(N-1,Math.floor((t-t0)/((t1-t0)||1)*N))]++; });
  const mx=Math.max(...bins);
  bins.forEach(v=>{ const i=el("i");
    i.style.height=(v?2+9*v/mx:1)+"px";
    if(v) i.style.background=color;
    wrap.appendChild(i); });
  return wrap;
}

/* ── 錄製與回傳 ─────────────────────────────────────── */
function drawCaps(){
  const box=$("#secC"); box.textContent="";
  const gs=P.captures, on=P.onboard;
  const pend=on.files.filter(f=>!f.complete).length;

  const top=el("div","card"); top.style.padding="11px 13px";
  const th=el("div","secthead");

  th.appendChild(el("span","spacer"));

  t0.dataset.tip=`機上錄製由代理回傳到地面站；待回傳＝還沒收齊的檔案。地面站錄製保留 ${gs.keep_days} 天、機上錄製保留 ${on.keep_days} 天，到期自動清掉——要留久的先下載。`;
  th.appendChild(t0);
  top.appendChild(th);
  const b3=el("div","big3");
  const one=(n,l)=>{ const s=el("span"); s.appendChild(el("b","n",String(n)));
    s.appendChild(el("span","l",l)); b3.appendChild(s); };
  one(pend,"待回傳"); one(on.files.length,"機上檔案");
  one(`${(gs.free_mb/1024).toFixed(0)} GB`,"地面站剩餘");
  top.appendChild(b3);
  box.appendChild(top);

  // 回傳狀態：**一台一列**。三張卡各抄一遍同一段說明，那段話搬進 ⓘ
  const cv=el("div","card"); cv.style.padding="11px 13px";
  const cvh=el("div","secthead");
  cvh.appendChild(el("h4",null,"最近一趟的涵蓋"));
  cvh.appendChild(el("span","lab",
    `${P.detail.coverage.drone_name}・${day(P.detail.session.started_at)} ${hm(P.detail.session.started_at)}`));
  cvh.appendChild(el("span","spacer"));
  const tc=el("span","info","ⓘ"); tc.tabIndex=0;
  tc.dataset.tip="上排＝機上錄的（飛控直接送出的那一份），下排＝地面站錄的（送到地面站的那一份）。斜線＝那一段沒有錄到。兩層都缺的那幾段，這個系統沒有任何備份——機上那份是唯一能補斷線缺口的東西。";
  cvh.appendChild(tc);
  cv.appendChild(cvh);
  cv.appendChild(coverage(P.detail.coverage));
  box.appendChild(cv);

  const ag=el("div","card"); ag.style.padding="11px 13px";
  const ah=el("div","secthead");
  ah.appendChild(el("h4",null,"各機的機上錄製"));
  ah.appendChild(el("span","spacer"));
  const t1=el("span","info","ⓘ"); t1.tabIndex=0;
  t1.dataset.tip="「不知道」＝這台機沒有代理，我方無從得知它有沒有在機上錄——不是「沒有錄」。沒有機上錄製的機只有地面站那一份，斷線的那幾段沒有備份。";
  ah.appendChild(t1);
  ag.appendChild(ah);
  P.drones.forEach(d=>{
    const r=el("div","agentrow");
    const dot=el("span","edot");
    dot.style.background=d.agent?"#0ca30c":"transparent";
    if(!d.agent) dot.style.border="1.5px solid var(--muted)";
    r.appendChild(dot);
    r.appendChild(el("span",null,d.name));
    r.appendChild(el("span","spacer"));
    r.appendChild(el("span","ct", d.agent?"已同步":"不知道"));
    if(d.agent) r.appendChild(el("span","ct",`代理 ${d.agent.agent_version}`));
    ag.appendChild(r);
  });
  box.appendChild(ag);

  const fc=el("div","card"); fc.style.padding="11px 13px";
  const fh=el("div","secthead");
  fh.appendChild(el("h4",null,`機上錄製（${on.files.length}）`));
  fh.appendChild(el("span","spacer"));
  fh.appendChild(el("span","lab",`保留 ${on.keep_days} 天`));
  fc.appendChild(fh);
  const w=el("div","tablewrap"); const t=el("table");
  t.innerHTML=`<thead><tr><th>檔案</th><th>無人機</th><th class="n">大小</th>
    <th>狀態</th><th>收到</th></tr></thead><tbody>${
    on.files.slice(0,10).map(f=>`<tr><td>${f.name}</td><td>${f.drone_name}</td>
      <td class="n">${(f.bytes/1048576).toFixed(1)} MB</td>
      <td>${f.complete?'<span class="pilltiny ok">已回傳</span>'
                      :'<span class="pilltiny no">未收齊</span>'}</td>
      <td>${f.received?`${day(f.received)} ${hm(f.received)}`:"—"}</td></tr>`).join("")}</tbody>`;
  w.appendChild(t); fc.appendChild(w);
  if(on.files.length>10) fc.appendChild(el("div","hint",`列出最近 10 份，共 ${on.files.length} 份。`));
  box.appendChild(fc);
}

/* ── modal：原始資料的家 ─────────────────────────────── */
function openRaw(title, meta, obj){
  $("#mtitle").textContent=title;
  $("#mmeta").textContent=meta;
  const b=$("#mbody"); b.textContent="";
  const pre=el("pre","raw", JSON.stringify(obj,null,2));
  b.appendChild(pre);
  $("#mask").hidden=false;
}
$("#mclose").onclick=()=>{ $("#mask").hidden=true; };
$("#mask").onclick=(e)=>{ if(e.target.id==="mask") $("#mask").hidden=true; };

/* ── 分頁 ───────────────────────────────────────────── */
const TABS=[["tF","secF",drawFlights],["tE","secE",drawEvents],["tC","secC",drawCaps]];
function show(id){
  TABS.forEach(([t,s,fn])=>{
    const on=t===id;
    $("#"+t).setAttribute("aria-selected",on?"true":"false");
    $("#"+s).hidden=!on;
    if(on) fn();
  });
}
TABS.forEach(([t])=>{ $("#"+t).onclick=()=>show(t); });
show("tF");
})();
</script>
