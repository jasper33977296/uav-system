<title>UAV 場域訊號比較 v2</title>
<style>
:root{
  color-scheme:dark;
  --page:#1b1a17; --surface:#262624; --surface-2:#30302c;
  --ink:#f0eee6; --ink-2:#c2bfb3; --muted:#8f8b80; --hairline:#3a3833;
  --border:rgba(240,238,230,.1);
  --accent:#d97757; --accent-bg:rgba(217,119,87,.12);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --ok:#0ca30c; --warn:#fab219; --serious:#e05e0e; --danger:#a01818; --danger-ink:#e05e5e;
  --sinr-good:#0ca30c; --sinr-fair:#fab219; --sinr-bad:#e05e0e; --sinr-crit:#a01818;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Noto Sans TC","Segoe UI",sans-serif;
  background:var(--page);color:var(--ink);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.shell{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.nav{flex:none;height:46px;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--surface);border-bottom:1px solid var(--hairline)}
.brand{font-size:13px;font-weight:700}
.navtabs{display:flex;gap:2px}
.navtabs button{padding:5px 9px;border-radius:6px;color:var(--muted);display:grid;place-items:center}
.navtabs button[aria-current="true"]{color:var(--accent);background:var(--accent-bg)}
.reclight{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.recdot{width:11px;height:11px;border-radius:50%;background:var(--muted)}

.info{width:15px;height:15px;border-radius:50%;border:1px solid var(--hairline);
  color:var(--muted);font-size:10px;display:inline-grid;place-items:center;position:relative;
  flex:none;cursor:help;line-height:1}
.info:hover,.info:focus-visible{color:var(--ink);border-color:var(--border)}
.info::after{content:attr(data-tip);position:absolute;right:-2px;top:20px;width:266px;z-index:60;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;font-size:11px;line-height:1.65;text-align:left;font-weight:400;
  box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .12s}
.info:hover::after,.info:focus-visible::after{opacity:1;visibility:visible}

/* 分頁切換 */
.tabs{flex:none;display:flex;gap:3px;padding:8px 14px 0;background:var(--page);
  border-bottom:1px solid var(--hairline)}
.tabs button{padding:6px 13px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink-2)}

.body{flex:1;min-height:0;position:relative;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;background:#14181c}
.overlay{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:9px;
  width:288px;max-height:calc(100% - 24px);overflow-y:auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px;
  box-shadow:0 4px 16px rgba(0,0,0,.35)}
.card h3{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.h3-note{font-size:11px;color:var(--muted);font-weight:400}
.row{display:flex;align-items:center;gap:7px;margin-top:7px}
.lab{font-size:11px;color:var(--muted);white-space:nowrap}
.pills{display:inline-flex;gap:3px}
.pill{padding:2px 9px;border-radius:6px;border:1px solid transparent;color:var(--muted);font-size:11.5px}
.pill:hover{color:var(--ink-2)}
.pill[aria-pressed="true"]{color:var(--ink);background:var(--surface-2);border-color:var(--border)}
select{background:var(--page);border:1px solid var(--hairline);border-radius:7px;
  padding:4px 8px;font-size:12px;color:var(--ink);flex:1;min-width:0}
.hint{font-size:11px;color:var(--muted);line-height:1.7;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:999px;
  background:var(--surface-2);font-size:11px;color:var(--ink-2)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.btn{padding:3px 10px;border:1px solid var(--hairline);border-radius:7px;color:var(--ink-2);
  background:var(--surface-2);font-size:12px}
.btn:hover{color:var(--ink);border-color:var(--border)}
.name-lg{font-size:13.5px;font-weight:700}

.legend{position:absolute;left:12px;bottom:12px;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;padding:8px 11px;font-size:11.5px;
  display:flex;align-items:center;gap:9px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.legend-lab{color:var(--muted)}
.legend-seg{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.legend-sw{width:14px;height:6px;border-radius:2px;flex:none}
.scalebar{position:absolute;right:12px;bottom:14px;font-size:11px;color:var(--ink-2)}

/* 前後比較 */
.ab{position:absolute;inset:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ab .card{box-shadow:none}
.picker{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.picker .side{display:flex;align-items:center;gap:6px;flex:1;min-width:260px}
.sidedot{width:9px;height:9px;border-radius:50%;flex:none}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;
  padding:0 8px 6px;border-bottom:1px solid var(--hairline)}
td{padding:5px 8px;border-bottom:1px solid rgba(58,56,51,.55);color:var(--ink-2)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.verdict{margin-top:8px;padding:7px 10px;border-radius:8px;background:var(--surface-2);
  font-size:12px;color:var(--ink-2);line-height:1.7}
.verdict .why{color:var(--muted);font-size:11px}
.abchart svg{width:100%;height:170px;display:block}
.abmap svg{width:100%;height:260px;display:block;background:#14181c;border-radius:8px}
.ablegend{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink-2);margin-top:7px}
.ablegend .sw{width:16px;height:8px;border-radius:2px;display:inline-block}
.ablegend .sw-none{border:1px dashed var(--muted);background:none}
.mis{color:var(--muted);font-size:11.5px}
.scoperow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.scoperow select{flex:0 0 auto;padding:3px 8px;max-width:320px}
.tripsel{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.tripchip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:8px;
  border:1px solid var(--hairline);background:var(--page);color:var(--ink-2);font-size:12px}
.tripchip:hover{border-color:var(--border);color:var(--ink)}
.tripchip[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);border-color:var(--border)}
.verdicts{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.vrow{display:flex;align-items:center;gap:8px;padding:4px 2px;font-size:12px;
  border-bottom:1px solid rgba(58,56,51,.5)}
.vname{color:var(--ink)}
.vsay{color:var(--ink-2)}
.vnum{font-family:var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.vnum2{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.hintrow{display:flex;align-items:center;gap:7px;margin-top:8px}
</style>

      </div>
      <div class="scalebar">格 10 m · 傾斜 55°</div>
    </section>

    <!-- ── 前後比較 ───────────────────────────────── -->
    <section id="ab" class="ab" hidden></section>
  </div>
</div>

<script>
(function(){
"use strict";
const P=window.PROTO, $=(s)=>document.querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;};

const CLS=[{k:"good",l:"良好",c:"#0ca30c",min:13},{k:"fair",l:"尚可",c:"#fab219",min:5},
           {k:"bad",l:"劣化",c:"#e05e0e",min:-2},{k:"crit",l:"瀕斷",c:"#a01818",min:-Infinity}];
const cls=(v)=>CLS.find(c=>v>=c.min)||CLS[3];
const f1=(v)=>v==null?"—":v.toFixed(1);

/* ── 篩選狀態 ─────────────────────────────────── */
const S={range:0, mission:"all", drone:"all", zones:true, sel:null, tab:"field"};

const inRange=(s)=>{
  if(!S.range) return true;
  return (Date.now()-new Date(s.start).getTime())/86400000 <= S.range;
};
const visible=()=>P.sessions.filter(s=>inRange(s)
  && (S.mission==="all" || (s.mission||"—")===S.mission)
  && (S.drone==="all" || s.drone===S.drone));

/* ── 3D 視角（同即時／回放頁：傾斜 55°、10 m 網格）───────── */
const V=(()=>{
  const PIT=55*Math.PI/180, BRG=28*Math.PI/180;
  const cb=Math.cos(BRG), sb=Math.sin(BRG), cp=Math.cos(PIT), sp=Math.sin(PIT);
  const proj=(e,n)=>{const X=e*cb+n*sb, Y=-e*sb+n*cb; return [X,-Y*cp];};
  const pts=[];
  Object.values(P.runs).forEach(r=>r.forEach(p=>pts.push(proj(p.e,p.north))));
  P.cells.forEach(c=>pts.push(proj(c.e,c.north)));
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const pad=70, k=Math.min((1200-pad*2)/(maxX-minX||1),(800-pad*2)/(maxY-minY||1));
  const ox=(1200-(maxX-minX)*k)/2-minX*k, oy=(800-(maxY-minY)*k)/2-minY*k;
  return {k, at:(e,n)=>{const [x,y]=proj(e,n); return [x*k+ox,y*k+oy];}};
})();

function drawField(){
  const svg=$("#map"), ns="http://www.w3.org/2000/svg";
  svg.textContent="";
  const g=(tag,a)=>{const n=document.createElementNS(ns,tag); for(const k in a) n.setAttribute(k,a[k]); return n;};
  const vis=visible(), ids=new Set(vis.map(s=>s.id));

  // 地面網格（10 m，與比例尺同一個數字）
  const grid=g("g",{stroke:"#232a2f","stroke-width":1});
  const es=Object.values(P.runs).flat().map(p=>p.e), nsv=Object.values(P.runs).flat().map(p=>p.north);
  const e0=Math.floor(Math.min(...es)/10)*10-20, e1=Math.ceil(Math.max(...es)/10)*10+20;
  const n0=Math.floor(Math.min(...nsv)/10)*10-20, n1=Math.ceil(Math.max(...nsv)/10)*10+20;
  const step=Math.max(10, Math.round((e1-e0)/40/10)*10);
  for(let e=e0;e<=e1;e+=step){const a=V.at(e,n0),b=V.at(e,n1);
    grid.appendChild(g("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1]}));}
  for(let n=n0;n<=n1;n+=step){const a=V.at(e0,n),b=V.at(e1,n);
    grid.appendChild(g("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1]}));}
  svg.appendChild(grid);

  // 軌跡：**單趟半透明**，多趟疊在同一處自然變濃（濃淡＝一致性）
  for(const [sid,pts] of Object.entries(P.runs)){
    if(!ids.has(sid)) continue;
    const on = !S.sel || (S.sel.type==="run" && S.sel.id===sid);
    for(let i=1;i<pts.length;i++){
      const a=V.at(pts[i-1].e,pts[i-1].north), b=V.at(pts[i].e,pts[i].north);
      const dist=Math.hypot(pts[i].e-pts[i-1].e, pts[i].north-pts[i-1].north);
      if(dist>25) continue;                     // 斷開的兩點不連線（那是跳段）
      const ln=g("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],
        stroke:cls(pts[i].s).c,"stroke-width":4,"stroke-linecap":"round",
        "stroke-opacity": on?0.28:0.08});
      ln.style.cursor="pointer";
      ln.addEventListener("click",()=>{S.sel={type:"run",id:sid}; render();});
      svg.appendChild(ln);
    }
  }

  // 弱區輪廓：10 m 格、P10 落在劣化以下且 ≥2 趟——**只圈飛過的地方**
  if(S.zones){
    P.weak.forEach(c=>{
      const h=P.cell/2;
      const pts=[[c.e-h,c.north-h],[c.e+h,c.north-h],[c.e+h,c.north+h],[c.e-h,c.north+h]]
        .map(([e,n])=>V.at(e,n).map(v=>v.toFixed(1)).join(",")).join(" ");
      const poly=g("polygon",{points:pts,fill:"rgba(160,24,24,.10)",
        stroke:"#f0eee6","stroke-width":1.2,"stroke-dasharray":"4 3","stroke-opacity":.8});
      poly.style.cursor="pointer";
      poly.addEventListener("click",()=>{S.sel={type:"zone",cell:c}; render();});
      svg.appendChild(poly);
      const [lx,ly]=V.at(c.e,c.north);
      const t=g("text",{x:lx,y:ly+4,fill:"#f0eee6","font-size":11,"text-anchor":"middle"});
      t.textContent=`▼${c.min.toFixed(0)}`;
      svg.appendChild(t);
    });
  }

  $("#tripcount").textContent=`${vis.length} 趟`;
  $("#weakcount").textContent=S.zones?`${P.weak.length} 個弱區`:"";
  // **誠實截斷**：略過與上限如實揭露，不靜靜少畫
  // **誠實截斷只在真的少畫時才佔版面**：全部畫得出來時這句話沒有資訊
  $("#honesty").textContent = vis.length < P.sessions.length
    ? `${P.sessions.length} 趟裡畫了 ${vis.length} 趟` : "";
  drawSel();
}

/* ── 比較（2026-09-08：從「前後兩趟」擴成 N 趟，並加上「比較單位」）─────
 *
 * **基準是一趟，不是「前」。** 兩趟時可以叫前後，三趟以上就不能——所以是
 * 「基準 ＋ 對照 N 趟」：每一趟各自對基準算沿里程對照，摘要表逐列給 Δ。
 * 差值熱區本質是兩兩比對，所以留一排 pill 選「現在看哪一趟對基準」。
 *
 * **比較單位有三種**（使用者要求 2026-09-08）。三種共用同一套演算法
 * （沿基準軌跡的弧長對齊），差的是**候選怎麼圈、標籤帶什麼、以及差異可以
 * 怎麼解讀**——後面這件事最重要，所以每個模式都有一句話說清楚：
 *
 *   time    以時間      同一台機不同時間。路徑不保證一樣。
 *   mission 同機同任務  同一台機、同一條任務飛過多趟。**唯一路徑一致的模式**
 *                       ——共同區間會接近全滿，差異才真的是「這次比較差」。
 *   cross   跨機跨任務  不同機、不同任務。差異可能來自機／模組本身。
 *
 * 標籤跟著模式換：只有時間時「08/13 16:37」就夠；跨機時不帶機名根本分不出
 * 誰是誰。**同一個畫面在不同模式下說不同的話，是因為它比的真的是不同的東西。**
 */
const IDC=["#3987e5","#d95926","#199e70"], OVER="#8f8b80";
const tripColor=(i)=> i<IDC.length ? IDC[i] : OVER;
const POOL=P.cmp.pool;
const pairOf=(a,b)=> P.cmp.pairs[`${a}|${b}`] ?? null;

const MODES={
  time:{ label:"以時間",
    say:"同一台機、不同時間的架次。路徑不保證一樣——「共同區間」就是兩趟實際重疊了多少。" },
  mission:{ label:"同一台機・同一任務",
    say:"同一台機把同一條任務飛過多趟。這是唯一路徑一致的模式：共同區間會接近全滿，差異才真的是「這一趟比較差」。" },
  cross:{ label:"跨機・跨任務",
    say:"不同機、不同任務。里程對齊是把每一趟投影到基準的軌跡上算的，路徑不同時共同區間會很少；而且差異可能來自機或模組本身，不只是位置。" },
};

const C={ mode:"time", drone:null, mission:null, base:null,
          sel:new Set(), heat:null };

/** 這個模式下可以拿來比的架次（時間新→舊）。 */
function candidates(){
  if(C.mode==="cross") return POOL;
  const byDrone=POOL.filter(s=>s.drone===C.drone);
  if(C.mode==="time") return byDrone;
  return byDrone.filter(s=>(s.mission??null)===(C.mission??null));
}
/** 標籤：帶到剛好能分辨為止，不多帶。 */
function tripLabel(s){
  if(C.mode==="cross") return `${s.drone} · ${s.clock}`;
  if(C.mode==="mission"){
    const seq=candidates().slice().sort((a,b)=>a.start<b.start?-1:1);
    const i=seq.findIndex(x=>x.id===s.id);
    return `第 ${i+1} 趟 · ${s.clock}`;
  }
  return s.clock;
}
const metaOf=(id)=>POOL.find(s=>s.id===id);

/** 換模式／換範圍之後把選擇重新落在合法的架次上。
 *  **不保留上一個模式的選擇**——那會讓畫面上出現這個範圍裡根本沒有的趟次。 */
/** 切到「同機同任務」時，把機換到**真的有任務紀錄**的那一台。
 *  停在一台沒有任務的機上，畫面會是空的——那不是這個模式的樣子。 */
function seatMission(){
  const has=POOL.filter(s=>s.mission);
  if(!has.length || has.some(s=>s.drone===C.drone)) {
    if(!POOL.some(s=>s.drone===C.drone && s.mission===C.mission))
      C.mission=POOL.find(s=>s.drone===C.drone && s.mission)?.mission ?? C.mission;
    return;
  }
  const cnt={}; has.forEach(s=>{cnt[s.drone]=(cnt[s.drone]??0)+1;});
  C.drone=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];
  C.mission=has.find(s=>s.drone===C.drone).mission;
}

/** 切到「跨機・跨任務」時，預設就挑到**別台機**去。
 *  沿用上一個模式的選擇會讓這個模式一進來全是同一台機的架次——
 *  那正是它要對照的反面。 */
function seatCross(){
  const base=metaOf(C.base) ?? POOL[0];
  if(!base) return;
  C.base=base.id;
  const others=POOL.filter(s=>s.id!==C.base && s.drone!==base.drone).slice(0,2);
  const same=POOL.filter(s=>s.id!==C.base && s.drone===base.drone).slice(0,1);
  C.sel=new Set([...others,...same].map(s=>s.id));
  C.heat=[...C.sel][0] ?? null;
}

function reseat(){
  const cand=candidates();
  if(!cand.length){ C.base=null; C.sel=new Set(); C.heat=null; return; }
  if(!cand.some(s=>s.id===C.base)) C.base=cand[0].id;
  const rest=cand.filter(s=>s.id!==C.base).map(s=>s.id);
  C.sel=new Set([...C.sel].filter(id=>rest.includes(id)));
  if(!C.sel.size) rest.slice(0,3).forEach(id=>C.sel.add(id));
  if(!C.sel.has(C.heat)) C.heat=[...C.sel][0] ?? null;
}
(function init(){
  // 預設挑**架次最多**的那台機——挑最新的那台可能只有一趟，一進來就是空畫面
  const cnt={}; POOL.forEach(s=>{cnt[s.drone]=(cnt[s.drone]??0)+1;});
  C.drone=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0] ?? null;
  C.mission=POOL.find(s=>s.mission)?.mission ?? null;
  reseat();
})();

function drawAb(){
  const box=$("#ab"); box.textContent="";

  // ① 比較單位：先講清楚在比什麼，再選誰跟誰
  const c0=el("div","card");
  const h0=el("h3",null,"比較什麼");
  h0.appendChild(el("span","spacer"));
  const t0=el("span","info","ⓘ"); t0.tabIndex=0;
  t0.dataset.tip="三種單位用同一套對齊：沿基準軌跡的弧長里程，不是時間"
    +"（兩趟速度不同，時間對齊會錯位）；偏離基準路徑逾 60 m 的樣本不納入。"
    +"　以時間＝同一台機不同時間，路徑不保證一樣。"
    +"　同一台機・同一任務＝唯一路徑一致的模式，共同區間會接近全滿。"
    +"　跨機・跨任務＝差異可能來自機或模組本身，不只是位置。";
  h0.appendChild(t0);
  c0.appendChild(h0);
  const seg=el("div","pills");
  Object.entries(MODES).forEach(([k,m])=>{
    const b=el("button","pill", m.label);
    b.setAttribute("aria-pressed", C.mode===k?"true":"false");
    b.onclick=()=>{ C.mode=k; if(k==="mission") seatMission();
      if(k==="cross") seatCross();
      reseat(); drawAb(); };
    seg.appendChild(b);
  });
  c0.appendChild(seg);
  // 範圍：時間／同任務要先定住是哪一台機（同任務再定住哪一條任務）
  if(C.mode!=="cross"){
    const row=el("div","scoperow");
    row.appendChild(el("span","lab","機"));
    const ds=el("select");
    [...new Set(POOL.map(s=>s.drone))].forEach(d=>{
      const o=el("option",null,d); o.value=d; ds.appendChild(o);});
    ds.value=C.drone;
    ds.onchange=()=>{ C.drone=ds.value;
      if(C.mode==="mission"){
        const ms=POOL.filter(s=>s.drone===C.drone && s.mission);
        C.mission=ms[0]?.mission ?? null;
      }
      reseat(); drawAb(); };
    row.appendChild(ds);
    if(C.mode==="mission"){
      row.appendChild(el("span","lab","任務"));
      const ms=el("select");
      const list=[...new Set(POOL.filter(s=>s.drone===C.drone)
        .map(s=>s.mission).filter(Boolean))];
      if(!list.length){
        const o=el("option",null,"（沒有任務紀錄）"); o.value=""; ms.appendChild(o);
        ms.disabled=true;
      } else list.forEach(m=>{ const o=el("option",null,m); o.value=m; ms.appendChild(o); });
      // **只在選項真的存在時才設值**：設成不存在的值會讓 select 變成空白，
      // 看起來像「壞了」而不是「這台機沒有任務」
      if(C.mission && list.includes(C.mission)) ms.value=C.mission;
      ms.onchange=()=>{ C.mission=ms.value; reseat(); drawAb(); };
      row.appendChild(ms);
    }
    c0.appendChild(row);
  }
  box.appendChild(c0);

  const cand=candidates();
  // **不足以比較時直說是哪一種不足**：沒有候選、只有一趟，是兩件不同的事
  if(cand.length<2){
    const c=el("div","card");
    // **三種「不能比」是三件不同的事**，講得出是哪一件，人才知道下一步做什麼
    const noMission = C.mode==="mission"
      && !POOL.some(s=>s.drone===C.drone && s.mission);
    c.appendChild(el("div","empty",
      noMission ? `${C.drone} 沒有任何一趟掛著任務——這個單位要先有任務紀錄。`
      : cand.length===0 ? "這個範圍裡沒有任何架次。"
      : C.mode==="mission"
        ? `${C.drone} 在「${C.mission}」上只有 1 趟——一趟不能比。要用這個單位，先讓同一條任務飛過兩趟以上。`
        : "這個範圍裡只有 1 趟——一趟不能比。"));
    box.appendChild(c); return;
  }

  // ② 基準與對照
  const base=metaOf(C.base);
  const rows=[...C.sel].map(id=>({ id, s:metaOf(id), pair:pairOf(C.base,id) }))
    .filter(r=>r.s && r.pair)
    .sort((a,b)=>a.s.start<b.s.start?1:-1);
  rows.forEach((r,i)=>{ r.color=tripColor(i); r.label=tripLabel(r.s); });

  const pick=el("div","card");
  const h1=el("h3",null,"比較對象");
  h1.appendChild(el("span","spacer"));
  const t1=el("span","info","ⓘ"); t1.tabIndex=0;
  t1.dataset.tip="所有對照都對同一個基準算，所以摘要表的 Δ 之間可以互相比。"
    +"第 4 趟起顏色一律灰（顏色到此不再承載識別），改看線末的標籤。";
  h1.appendChild(t1);
  pick.appendChild(h1);
  const brow=el("div","scoperow");
  brow.appendChild(el("span","lab","基準"));
  const bs=el("select");
  cand.forEach(s=>{ const o=el("option",null,tripLabel(s)); o.value=s.id; bs.appendChild(o); });
  bs.value=C.base;
  bs.onchange=()=>{ C.base=bs.value; reseat(); drawAb(); };
  brow.appendChild(bs);
  if(base?.mission) brow.appendChild(el("span","chip", base.mission));
  pick.appendChild(brow);
  const list=el("div","tripsel");
  cand.filter(s=>s.id!==C.base).forEach(s=>{
    const on=C.sel.has(s.id);
    const b=el("button","tripchip");
    b.setAttribute("aria-pressed", on?"true":"false");
    const r=rows.find(x=>x.id===s.id);
    const dot=el("span","sidedot");
    dot.style.background = on && r ? r.color : "var(--hairline)";
    b.appendChild(dot);
    b.appendChild(el("span",null,tripLabel(s)));
    const pr=pairOf(C.base,s.id);
    if(pr) b.appendChild(el("span","lab",`${pr.summary.b_sinr.n} 筆`));
    b.onclick=()=>{
      if(C.sel.has(s.id)) C.sel.delete(s.id); else C.sel.add(s.id);
      if(!C.sel.has(C.heat)) C.heat=[...C.sel][0] ?? null;
      drawAb();
    };
    list.appendChild(b);
  });
  pick.appendChild(list);
  box.appendChild(pick);

  if(!rows.length){
    const c=el("div","card");
    c.appendChild(el("div","hint","沒有選任何對照——上面挑一趟以上。"));
    box.appendChild(c); return;
  }

  // ③ 沿里程訊號
  const c1=el("div","card");
  const h2=el("h3",null,"沿里程訊號");
  h2.appendChild(el("span","spacer"));
  const t2=el("span","info","ⓘ"); t2.tabIndex=0;
  t2.dataset.tip="每格取該里程區間內樣本的平均；虛線是 5／13 dB 門檻"
    +"（與 backend 事件門檻同一出處）。「逐段」只比對兩趟都飛過的區間、"
    +"逐段取差再取中位數；摘要表的 Δ 是各自整體統計之差，含各自獨飛的部分"
    +"——兩個都對，差很多代表兩趟走過的範圍差很多。持平門檻 ±2 dB。";
  h2.appendChild(t2);
  c1.appendChild(h2);
  c1.appendChild(multiChart(rows));
  const vs=el("div","verdicts");
  rows.forEach(r=>{
    const dS=median(r.pair.pts.filter(p=>p.a_sinr!=null&&p.b_sinr!=null)
      .map(p=>p.b_sinr-p.a_sinr));
    const say=dS==null?"沒有共同區間" : Math.abs(dS)<2?"大致持平" : dS>0?"較基準好":"較基準差";
    const row=el("div","vrow");
    const d=el("span","sidedot"); d.style.background=r.color; row.appendChild(d);
    row.appendChild(el("span","vname", r.label));
    row.appendChild(el("span","vsay", say));
    row.appendChild(el("span","spacer"));
    row.appendChild(el("span","vnum", dS==null?"—":`逐段 ${dS>0?"+":""}${f1(dS)} dB`));
    row.appendChild(el("span","vnum2", `共同區間 ${r.pair.paired}`));
    vs.appendChild(row);
  });
  c1.appendChild(vs);
  box.appendChild(c1);

  // ④ 摘要
  const c2=el("div","card");
  const h3=el("h3",null,"摘要");
  h3.appendChild(el("span","spacer"));
  const t3=el("span","info","ⓘ"); t3.tabIndex=0;
  t3.dataset.tip="p5＝最差 5%——尾部才是斷鏈的來源，所以它比均值重要。Δ 是對基準的差（正＝比基準好）。共同區間＝這一趟與基準都有樣本的里程格數，太少（<3）時趨勢不足採信。";
  h3.appendChild(t3);
  c2.appendChild(h3);
  const b0=rows[0].pair.summary.a_sinr;
  const X=C.mode==="cross";   // 跨機模式才多一欄任務
  const mis=(m)=>X?`<td class="mis">${m ?? "—"}</td>`:"";
  const tb=el("table");
  let html=`<tr><td><span class="chip">基準 ${tripLabel(base)}</span></td>${mis(base.mission)}
    <td class="n">${f1(b0.mean)}</td><td class="n">${f1(b0.p50)}</td>
    <td class="n"><b>${f1(b0.p5)}</b></td><td class="n">${b0.n}</td>
    <td class="n">—</td><td class="n">—</td></tr>`;
  rows.forEach(r=>{
    const b=r.pair.summary.b_sinr;
    const warn=r.pair.paired<3?' title="共同區間太少，趨勢不足採信"':"";
    html+=`<tr><td><span class="chip"><span class="dot" style="background:${r.color}"></span>${r.label}</span></td>${mis(r.s.mission)}
      <td class="n">${f1(b.mean)}</td><td class="n">${f1(b.p50)}</td>
      <td class="n"><b>${f1(b.p5)}</b></td><td class="n">${b.n}</td>
      <td class="n">${dd(b.p50-b0.p50)}</td>
      <td class="n"${warn}>${r.pair.paired}${r.pair.paired<3?" ⚠":""}</td></tr>`;
  });
  tb.innerHTML=`<thead><tr><th>趟次</th>${X?"<th>任務</th>":""}<th class="n">均值</th><th class="n">p50</th>
    <th class="n">p5</th><th class="n">樣本數</th><th class="n">Δp50</th>
    <th class="n">共同區間</th></tr></thead><tbody>${html}</tbody>`;
  c2.appendChild(tb);
  const big=rows.filter(r=>{
    const a=b0.n, b=r.pair.summary.b_sinr.n;
    return Math.max(a,b)/Math.max(1,Math.min(a,b))>3;
  });
  if(big.length) c2.appendChild(el("div","hint",
    `${big.map(r=>r.label).join("、")}：樣本數與基準差 3 倍以上`));
  box.appendChild(c2);

  // ⑤ 差值熱區（兩兩比對，所以要選一趟）
  const c3=el("div","card");
  const h4=el("h3",null,"差值熱區");
  h4.appendChild(el("span","spacer"));
  const t4=el("span","info","ⓘ"); t4.tabIndex=0;
  t4.dataset.tip="這一趟減基準，10 m 格。發散色盤：兩極用識別色、中點是灰——中點絕不用第三個色相，否則「沒變化」會看起來像另一種變化。虛框＝只有其中一趟有樣本，那不是「沒變化」。";
  h4.appendChild(t4);
  c3.appendChild(h4);
  const sel=el("div","pills");
  rows.forEach(r=>{
    const b=el("button","pill", r.label);
    b.setAttribute("aria-pressed", C.heat===r.id?"true":"false");
    b.onclick=()=>{C.heat=r.id; drawAb();};
    sel.appendChild(b);
  });
  c3.appendChild(sel);
  const ht=rows.find(r=>r.id===C.heat) ?? rows[0];
  c3.appendChild(deltaMap(ht.pair.delta, ht.pair.only));
  const lg=el("div","ablegend");
  lg.innerHTML=`<span class="sw" style="background:rgb(${dv(-8).join(",")})"></span>比基準差
    <span class="sw" style="background:rgb(143,139,128)"></span>無變化
    <span class="sw" style="background:rgb(${dv(8).join(",")})"></span>比基準好
    <span class="sw sw-none"></span>無對照`;
  c3.appendChild(lg);
  box.appendChild(c3);
}

function dd(v){ return v==null?"—":(v>0?"+":"")+v.toFixed(1); }

function multiChart(rows){
  // 右側留白照**最長的標籤**算：跨機模式的標籤帶機名，固定寬度會把字切掉，
  // 而切掉的正是用來分辨誰是誰的那一段
  const tw=(t)=>[...t].reduce((a,ch)=>a+(ch.charCodeAt(0)>255?10:5.4),0);
  const R=Math.min(320, 26+Math.max(...[...rows.map(r=>r.label),"基準"].map(tw)));
  const W=1000,H=190,L=44,T=12,Bm=22;
  const pts=rows.flatMap(r=>r.pair.pts);
  const xs=pts.map(p=>p.m);
  const vals=pts.flatMap(p=>[p.a_sinr,p.b_sinr]).filter(v=>v!=null);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=Math.min(...vals,-2), y1=Math.max(...vals,13);
  const pad=(y1-y0)*0.12||1; y0-=pad; y1+=pad;
  const X=v=>L+((v-x0)/((x1-x0)||1))*(W-L-R);
  const Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-Bm);
  let g="";
  [5,13].forEach(v=>{ if(v<y0||v>y1) return;
    g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"
      stroke="var(--warn)" stroke-width="1" stroke-dasharray="4 4" stroke-opacity=".45"/>`;});
  [y0+(y1-y0)*0.15,(y0+y1)/2,y1-(y1-y0)*0.15].forEach(v=>{
    g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--hairline)"/>
        <text x="${L-6}" y="${(Y(v)+3.5).toFixed(1)}" fill="var(--muted)" font-size="9" text-anchor="end">${v.toFixed(0)}</text>`;});
  // 線末標籤先收集再統一擺放：**幾條線會在同一個里程結束**，直接畫會疊在一起
  const labels=[];
  const line=(ps,key,color,label,dash)=>{
    const q=ps.filter(p=>p[key]!=null);
    if(q.length<2) return "";
    const d=q.map((p,i)=>`${i?"L":"M"}${X(p.m).toFixed(1)} ${Y(p[key]).toFixed(1)}`).join(" ");
    const last=q[q.length-1];
    labels.push({ex:X(last.m), ey:Y(last[key]), y:Y(last[key])+3.5, color, label});
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2"
      ${dash?'stroke-dasharray="5 4"':""} vector-effect="non-scaling-stroke"/>`
      + q.map(p=>`<circle cx="${X(p.m).toFixed(1)}" cy="${Y(p[key]).toFixed(1)}" r="2.2" fill="${color}"/>`).join("");
  };
  let body=line(rows[0].pair.pts,"a_sinr","var(--ink-2)","基準",true);
  rows.forEach(r=>{ body+=line(r.pair.pts,"b_sinr",r.color,r.label,false); });
  // 標籤全部靠右側留白排，彼此至少差 12px；引線接回各自線末的真實位置
  const lx=W-R+10;
  labels.sort((a2,b2)=>a2.y-b2.y);
  for(let i=1;i<labels.length;i++)
    if(labels[i].y-labels[i-1].y<12) labels[i].y=labels[i-1].y+12;
  const over=labels.length?labels[labels.length-1].y-(H-Bm):0;
  if(over>0) labels.forEach(l=>{ l.y-=over; });
  labels.forEach(l=>{
    body+=`<path d="M${l.ex.toFixed(1)} ${l.ey.toFixed(1)} L${(lx-4).toFixed(1)} ${(l.y-3.5).toFixed(1)}"
      fill="none" stroke="${l.color}" stroke-width="1" stroke-opacity=".45"/>`
      + `<text x="${lx}" y="${l.y.toFixed(1)}" fill="${l.color}" font-size="10">${l.label}</text>`;
  });
  const box=el("div","abchart");
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}${body}
    <text x="${L}" y="${H-5}" fill="var(--muted)" font-size="9">0 m</text>
    <text x="${W-R}" y="${H-5}" fill="var(--muted)" font-size="9" text-anchor="end">${Math.round(x1)} m</text>
    <text x="${L}" y="${T-2}" fill="var(--muted)" font-size="9">SINR dB</text></svg>`;
  return box;
}

function median(a){ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y);
  const i=Math.floor(s.length/2); return s.length%2?s[i]:(s[i-1]+s[i])/2; }
function dv(d,max=8){
  const t=Math.max(-1,Math.min(1,d/max)), grey=[143,139,128];
  const end=t>=0?[57,135,229]:[217,89,38], k=Math.abs(t);
  return [0,1,2].map(i=>Math.round(grey[i]+(end[i]-grey[i])*k));
}

function deltaMap(cells, only){
  const all=[...cells,...only];
  if(!all.length){ return el("div","hint","這一趟與基準沒有共同的里程區間——不畫空圖假裝有比較。"); }
  const es=all.map(c=>c.e), nsv=all.map(c=>c.north);
  const e0=Math.min(...es)-10,e1=Math.max(...es)+10,n0=Math.min(...nsv)-10,n1=Math.max(...nsv)+10;
  const W=1000,H=240,pad=20;
  const k=Math.min((W-pad*2)/((e1-e0)||1),(H-pad*2)/((n1-n0)||1));
  const X=e=>pad+(e-e0)*k, Y=n=>H-pad-(n-n0)*k;
  const h=5*k;
  let s2="";
  only.forEach(c=>{ s2+=`<rect x="${(X(c.e)-h).toFixed(1)}" y="${(Y(c.north)-h).toFixed(1)}"
    width="${(h*2).toFixed(1)}" height="${(h*2).toFixed(1)}" fill="none"
    stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`;});
  cells.forEach(c=>{ const [r,g2,b]=dv(c.d);
    s2+=`<rect x="${(X(c.e)-h).toFixed(1)}" y="${(Y(c.north)-h).toFixed(1)}"
      width="${(h*2).toFixed(1)}" height="${(h*2).toFixed(1)}" fill="rgb(${r},${g2},${b})" fill-opacity=".85">
      <title>${c.d>0?"+":""}${c.d.toFixed(1)} dB（基準 ${c.base}／這趟 ${c.this}）</title></rect>`;});
  const box=el("div","abmap");
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${s2}</svg>`;
  return box;
}

/* ── 篩選控制 ─────────────────────────────────── */
function buildControls(){
  const rr=$("#ranges"); rr.textContent="";
  [[7,"7天"],[30,"30天"],[0,"全部"]].forEach(([k,l])=>{
    const b=el("button","pill",l); b.setAttribute("aria-pressed", S.range===k?"true":"false");
    b.onclick=()=>{S.range=k; render();}; rr.appendChild(b);
  });
  const ms=$("#fMission"); ms.textContent="";
  const missions=[...new Set(P.sessions.map(s=>s.mission||"—"))];
  [["all","航線：全部"],...missions.map(m=>[m,`航線：${m}`])].forEach(([v,l])=>{
    const o=el("option",null,l); o.value=v; ms.appendChild(o);});
  ms.value=S.mission; ms.onchange=()=>{S.mission=ms.value; render();};
  const ds=$("#fDrone"); ds.textContent="";
  const drones=[...new Set(P.sessions.map(s=>s.drone))];
  [["all","機：全部"],...drones.map(m=>[m,`機：${m}`])].forEach(([v,l])=>{
    const o=el("option",null,l); o.value=v; ds.appendChild(o);});
  ds.value=S.drone; ds.onchange=()=>{S.drone=ds.value; render();};
  const zb=$("#zonesBtn");
  zb.setAttribute("aria-pressed", S.zones?"true":"false");
  zb.onclick=()=>{S.zones=!S.zones; render();};
}

$("#tabField").onclick=()=>{S.tab="field"; render();};
$("#tabAb").onclick=()=>{S.tab="ab"; render();};

function render(){
  $("#tabField").setAttribute("aria-selected", S.tab==="field"?"true":"false");
  $("#tabAb").setAttribute("aria-selected", S.tab==="ab"?"true":"false");
  $("#field").hidden = S.tab!=="field";
  $("#ab").hidden = S.tab!=="ab";
  if(S.tab==="field"){ buildControls(); drawField(); }
  else drawAb();
}
render();
})();
</script>
