# 地面站影像收流／錄製（issue 022；設計見 doc/flight-video-design.md）。
#
# 為什麼是獨立容器：錄影不能綁在 backend（--reload 改一行就中斷錄影）。
# 為什麼是 fmp4：實測錄製中 SIGKILL，一般 mp4 的 moov atom 在檔尾 → 整個檔
# 報廢（45MB 全損）；fmp4 完整可播。本案「斷流是常態＋地面站會重啟」，
# 這是硬需求不是偏好。recordPartDuration 即 RPO（最壞丟 1 秒）。

logLevel: info

# API：架次觸發用（armed 開錄／disarmed 收錄，見 backend video_rec.py）
api: yes
apiAddress: :9997

# 收流：機上 MediaMTX 或測試來源推 RTSP 進來
rtsp: yes
rtspAddress: :8554

# 瀏覽器即時畫面（WHEP）：前端 video_url 指這裡，少一條跨 5G 的瀏覽器直連，
# 且與「錄下來的」是同一份流
webrtc: yes
webrtcAddress: :8889

hls: no
rtmp: no
srt: no

# 依時間區間取片段（回放用；DB 仍是錨點的事實源，見設計 §4）
playback: yes
playbackAddress: :9996

pathDefaults:
  # 預設不錄——由 backend 依架次生命週期經 API 逐台打開（見設計 §3、§6b）。
  # 這樣「沒錄」是明確的設定狀態，不是碰巧沒錄到。
  record: no
  recordPath: /rec/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s        # ＝ RPO：系統崩潰最壞丟這麼多
  recordSegmentDuration: 10m    # 段越短，崩潰損失上限越小、時間定位越細
  # 保留天數**由 compose 的 MTX_PATHDEFAULTS_RECORDDELETEAFTER 覆寫**（單一事實源＝
  # .env 的 VIDEO_RETENTION_DAYS，同時餵 backend 的 retention_days）。這裡的值只是
  # 沒帶 env 時的後備，改這裡不會改到前端顯示的天數——要改請改 .env。
  recordDeleteAfter: 168h       # 後備：7 天（使用者定案，影像與量測資料 30 天脫鉤）

paths:
  # 真機：每台一條 path，名稱用 uav-<sysid>，由 backend 依 mav_sysid 對應。
  # 生產時 source 指向機上 MediaMTX；開發時由測試來源 publish 進來（source: publisher）。
  # 用 all_others 讓測試來源不必預先宣告即可推流。

  # sysid 1＝ai-model-rb5（10.141.2.145）。**拉流而非等推流**：這台是 ModalAI
  # RB5，機上跑的是 voxl-streamer（GStreamer RTSP server，:8900/live，H264 Main
  # 4.1），出廠行為是「等客戶端來拉」——QGC 就是這樣接的。設計文件假設的
  # 「機上 MediaMTX 主動推到地面站」在這台機上不成立（同 issues/016 的平台層
  # 落差：出廠不會主動打我方端點），所以這裡由地面站主動去拉。
  #
  # sourceOnDemand: yes＝沒人看就不拉。voxl-streamer 對多客戶端支援有限，
  # 常駐拉流會全程與 QGC 搶同一條流；改成有人看才拉，把衝突縮到最小。
  # 錄影需求（架次期間必須有流）由 backend 依 armed 開錄時觸發，屆時仍會拉起。
  uav-1:
    source: rtsp://10.141.2.145:8900/live
    rtspTransport: tcp           # RTP over TCP：跨 5G 少掉 UDP 打洞與丟包重組問題
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 10s

  all_others:
