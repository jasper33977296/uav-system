# 地面站影像收流／錄製（issue 022；設計見 doc/flight-video-design.md）。
#
# 為什麼是獨立容器：錄影不能綁在 backend（--reload 改一行就中斷錄影）。
# 為什麼是 fmp4：實測錄製中 SIGKILL，一般 mp4 的 moov atom 在檔尾 → 整個檔
# 報廢（45MB 全損）；fmp4 完整可播。本案「斷流是常態＋地面站會重啟」，
# 這是硬需求不是偏好。recordPartDuration 即 RPO（最壞丟 1 秒）。

logLevel: info

# API：架次觸發用（armed 開錄／disarmed 收錄，見 backend video_rec.py）
api: yes
apiAddress: :9997

# 收流：機上 MediaMTX 或測試來源推 RTSP 進來
rtsp: yes
rtspAddress: :8554

# 瀏覽器即時畫面（WHEP）：前端 video_url 指這裡，少一條跨 5G 的瀏覽器直連，
# 且與「錄下來的」是同一份流
webrtc: yes
webrtcAddress: :8889

hls: no
rtmp: no
srt: no

# 依時間區間取片段（回放用；DB 仍是錨點的事實源，見設計 §4）
playback: yes
playbackAddress: :9996

pathDefaults:
  # 預設不錄——由 backend 依架次生命週期經 API 逐台打開（見設計 §3、§6b）。
  # 這樣「沒錄」是明確的設定狀態，不是碰巧沒錄到。
  record: no
  recordPath: /rec/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s        # ＝ RPO：系統崩潰最壞丟這麼多
  recordSegmentDuration: 10m    # 段越短，崩潰損失上限越小、時間定位越細
  # 保留天數**由 compose 的 MTX_PATHDEFAULTS_RECORDDELETEAFTER 覆寫**（單一事實源＝
  # .env 的 VIDEO_RETENTION_DAYS，同時餵 backend 的 retention_days）。這裡的值只是
  # 沒帶 env 時的後備，改這裡不會改到前端顯示的天數——要改請改 .env。
  recordDeleteAfter: 168h       # 後備：7 天（使用者定案，影像與量測資料 30 天脫鉤）

paths:
  # ⚠ **path 名稱是 `uav-<sysid>`，而 sysid 會被重新指派**（issues/040）。
  # 2026-09-08 實測到的後果：`uav-1` 這條 path 的 source 寫死指向
  # `10.141.2.145`（ai-model-rb5 的相機），而 sysid 1 那時已經是
  # pi5-sdmodelh7v2-ardu——**一旦相機通了，pi5 的架次會錄到另一台的畫面**，
  # 而 `sync_segments` 用時間區間歸屬，會照樣把它記在 pi5 名下。
  # 一台機的影像被記在另一台的架次名下，事後幾乎救不回來。
  #
  # 所以 **path 要綁機的身分（drone_id／board_uid），不能綁 sysid**。
  # 那要改 `video_rec.path_for()` 與這個檔的產生方式（見
  # doc/flight-video-design.md §8d），而**現在沒有任何一台機上有相機**，
  # 所以先把那條說謊的 source 拿掉，不留一個指向不存在的東西的設定。
  #
  # 保留的說明（相機真的裝回來時要用到）：RB5 機上跑 voxl-streamer
  # （GStreamer RTSP server，:8900/live，H264 Main 4.1），出廠行為是
  # 「等客戶端來拉」，所以那台要由地面站主動拉、不是等它推
  # （同 issues/016 的平台層落差）。`sourceOnDemand: yes` 是為了不跟 QGC
  # 搶同一條流。
  #
  # uav-1:
  #   source: rtsp://<那台機的相機位址>:8900/live
  #   rtspTransport: tcp         # RTP over TCP：跨 5G 少掉 UDP 打洞與丟包重組
  #   sourceOnDemand: yes
  #   sourceOnDemandCloseAfter: 10s

  # 測試來源（`COMPOSE_PROFILES=sim`）不必預先宣告即可推流。
  all_others:
